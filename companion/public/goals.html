<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Goals — Jarvis</title>
<!--
  goals.html — the filter and the router.

  Operator: "having written goals sometimes feels like writing something and putting it on a shelf and never
  seeing them again... if you're not constantly thinking about a goal, seeing it, you're not pursuing it."

  WHAT IS DRAWN. Not goals connected to goals — goals connected to the ACTIONS they need, and actions to the
  actions in front of them. That is the real shape of his registry, and it makes the finding visible instead
  of merely reported: one hub with almost everything hanging off it. His own registry put it plainly — 67 of
  91 goals sit on top of the same single unblocked action, and that action is sending.

  Node size = leverage (how many LIVE goals an action moves) for actions, and how many times he wrote it
  across ten years for goals — his own signal about what he actually wants, not mine.

  Drawn with a small spring layout in canvas: no library, nothing from a CDN, per his Repo Security Audit rule.

  TONE. The compassion clause governs every string on this page. The decay counter says when he last wrote a
  goal, never that he is late. There is no gap number, no "days behind", no progress bar against a target.
  The heavy-day switch takes even the leverage table away and leaves one thing that costs nothing.
-->
<script>try{var _t=localStorage.getItem('jarvis-theme');document.documentElement.dataset.theme=(!_t||_t==='exec')?'black':_t;}catch(e){document.documentElement.dataset.theme='black';}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* ── ON THE DESIGN SYSTEM ────────────────────────────────────────────────────────────────────────
     This page first shipped with four invented hexes and no style.css, which meant it ignored
     data-theme entirely — a black page inside the app in True White. The design system's own rule:
     "tint with rgba(var(--teal-rgb),α) — never invent a hex", and "Jet Black is canonical".

     So every colour below comes from the theme contract in style.css. The radii and the type sizes are
     the system's own values: 15px on the one thing, 14px on cards, 10px on buttons, full on anything
     selectable; 14px body, 13.5 dense rows, 12 meta, and caps labels at 10/.12em. Counts use tabular
     numerals, which the system marks "no exceptions" — a leverage table whose digits shift width as it
     re-ranks is exactly the kind of small wrongness he notices and stops trusting. */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--cream); font-family: var(--font, 'Inter', system-ui, sans-serif);
    font-size: 14px; letter-spacing: -.011em; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 22px 20px 60px; }
  a.back { display: inline-block; margin-bottom: 12px; font-size: 13px; color: var(--teal); text-decoration: none; }
  h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 600; letter-spacing: -.02em; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 16px; line-height: 1.5; }

  /* THE ONE THING — the router's answer, above everything else. 15px radius is its own token. */
  .one { border: 1px solid rgba(var(--teal-rgb),.3); background: linear-gradient(180deg, rgba(var(--teal-rgb),.10), rgba(var(--teal-rgb),.03));
    border-radius: 15px; padding: 15px 18px; margin-bottom: 16px; }
  .one .lab { font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--teal); margin-bottom: 6px; }
  .one .t { font-size: 18px; font-weight: 500; line-height: 1.35; }
  .one .why { font-size: 12px; color: var(--dim); margin-top: 7px; line-height: 1.5; }

  .bar { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; align-items: center; }
  /* chips + tabs are "anything selectable" → full radius */
  button { background: rgba(var(--teal-rgb),.1); border: 1px solid rgba(var(--teal-rgb),.28); color: var(--cream);
    border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s; }
  button:hover:not(:disabled) { background: rgba(var(--teal-rgb),.2); }
  button:disabled { opacity: .4; cursor: default; }
  button.on { background: var(--teal); color: var(--ink-on-accent); border-color: var(--teal); font-weight: 600; }
  button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .status { font-size: 12px; color: var(--dim); margin-left: auto; font-variant-numeric: tabular-nums; }

  .grid { display: grid; grid-template-columns: 1fr 360px; gap: 16px; align-items: start; }
  @media (max-width: 950px) { .grid { grid-template-columns: 1fr; } }
  #cv { width: 100%; height: 580px; display: block; border-radius: 14px; border: 1px solid var(--line);
    background: var(--panel); cursor: grab; touch-action: none; }
  #cv:active { cursor: grabbing; }

  .side { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
  .side h2 { font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--dim); margin: 0 0 10px; }
  .row { padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:last-child { border-bottom: 0; }
  .row:hover .rt { color: var(--teal); }
  .rt { font-size: 13.5px; line-height: 1.35; }
  .rn { color: var(--teal); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; float: right; margin-left: 8px; }
  .rs { font-size: 12px; color: var(--dim); margin-top: 3px; line-height: 1.45; }
  .muted { color: var(--dim); font-size: 13px; line-height: 1.55; }

  /* the detail panel */
  .d-tier { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .12em; padding: 3px 9px;
    border-radius: 999px; margin-right: 6px; background: rgba(var(--teal-rgb),.16); color: var(--teal); }
  /* Dormant reads quieter than live — the tier IS the message, so it carries no accent. */
  .t-dream { background: rgba(var(--teal-rgb),.07); color: var(--dim); }
  .unconf { border-bottom: 1px dotted var(--dim); cursor: help; font-size: 11px; color: var(--dim); }
  .quote { border-left: 2px solid rgba(var(--teal-rgb),.4); padding: 4px 0 4px 11px; margin: 10px 0; font-size: 13.5px;
    line-height: 1.55; color: var(--cream); opacity: .88; font-style: italic; }
  .chain { margin-top: 10px; }
  .step { display: flex; gap: 9px; align-items: flex-start; padding: 5px 0; font-size: 13px; line-height: 1.4; }
  .step .dot { color: var(--dim); flex: 0 0 auto; width: 46px; font-size: 10px; font-weight: 600; letter-spacing: .12em; }
  .step.go .dot { color: var(--teal); }
  .step.go { color: var(--cream); }
  .step:not(.go) { color: var(--dim); }
  .decide { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .decide button { font-size: 12px; padding: 6px 12px; }
  .src { font-size: 11px; color: var(--dim); margin-top: 8px; }
  #pic img { width: 100%; border-radius: 10px; display: block; margin-top: 11px; }
  .note { font-size: 12px; color: var(--dim); margin-top: 10px; line-height: 1.5; }
</style>

<div class="wrap">
  <a class="back" href="/">← Jarvis</a>
  <h1>Goals</h1>
  <div class="sub" id="sub">loading…</div>

  <div class="one" id="one" hidden>
    <div class="lab" id="oneLab">START HERE</div>
    <div class="t" id="oneT"></div>
    <div class="why" id="oneWhy"></div>
  </div>

  <div class="bar">
    <button data-tier="all" class="f on">Everything</button>
    <button data-tier="true" class="f">Yours</button>
    <button data-tier="operating" class="f">The route</button>
    <button data-tier="dream" class="f">Dormant</button>
    <button id="heavy" title="Shows one thing that costs nothing, and puts the numbers away.">🌙 Heavy day</button>
    <span class="status" id="status"></span>
  </div>

  <div class="grid">
    <canvas id="cv"></canvas>
    <div>
      <div class="side" id="detailBox" hidden>
        <h2 id="detailH">THIS GOAL</h2>
        <div id="detail"></div>
      </div>
      <div class="side" id="freeBox" hidden>
        <h2>COSTS NOTHING · NEEDS NOBODY</h2>
        <div id="free"></div>
      </div>
      <div class="side" id="levBox">
        <h2>WHAT MOVES THE MOST</h2>
        <div id="lev"><div class="muted">loading…</div></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var D = null, tierFilter = 'all', heavy = false, sel = null;
  var nodes = [], edges = [], byId = {};

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function short(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

  /* Canvas can't read CSS variables, so it samples them. Without this the graph would be the one part of
     the page still painted in fixed hexes — teal strokes on a white page in True White. Re-sampled on every
     draw so a theme change repaints correctly rather than needing a reload. */
  var CSS = getComputedStyle(document.documentElement);
  function tok(name, fallback) { return (CSS.getPropertyValue(name) || '').trim() || fallback; }
  function wash(a) { return 'rgba(' + tok('--teal-rgb', '67,230,212') + ',' + a + ')'; }
  function theme() {
    CSS = getComputedStyle(document.documentElement);
    return { teal: tok('--teal', '#43e6d4'), cream: tok('--cream', '#f3f4f6'), dim: tok('--dim', '#8b909a'),
      line: tok('--line', 'rgba(255,255,255,.09)') };
  }

  /* ── load ───────────────────────────────────────────────────────────────────────────────────── */
  function load() {
    $('status').textContent = 'loading…';
    fetch('/api/goals' + (heavy ? '?hardDay=1' : ''))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) { $('sub').textContent = d.error || 'no registry found'; $('status').textContent = ''; return; }
        D = d; render();
      })
      .catch(function (e) { $('status').textContent = String(e.message || e); });
  }

  /* ── the headline ───────────────────────────────────────────────────────────────────────────── */
  function renderOne() {
    var box = $('one');
    if (heavy) {
      /* Hard Day Protocol: one free win. No targets recited, no deadlines, no gap number. */
      var w = D.oneThing;
      if (!w) { box.hidden = true; return; }
      box.hidden = false;
      $('oneLab').textContent = 'ONE THING, AND IT COSTS NOTHING';
      $('oneT').textContent = w.t;
      $('oneWhy').textContent = 'No money, no permission, nobody to wait on.';
      return;
    }
    var a = D.oneThing;
    if (!a || !a.title) { box.hidden = true; return; }
    box.hidden = false;
    $('oneLab').textContent = 'START HERE';
    $('oneT').textContent = a.title;
    var names = (a.liveGoals || []).map(function (id) { var g = byId[id]; return g ? g.t : id; });
    /* The LIVE count leads. 67 sounds enormous until you notice 48 of them were written at nineteen. */
    $('oneWhy').textContent = a.live
      ? 'Moves ' + a.live + ' of the goals you’re actually chasing' +
        (a.unlocks > a.live ? ' (and ' + (a.unlocks - a.live) + ' dormant ones)' : '') + ': ' +
        names.slice(0, 4).join(' · ') + (names.length > 4 ? ' …' : '')
      : (a.note || '');
  }

  /* ── the leverage table + the free wins ─────────────────────────────────────────────────────── */
  function renderSide() {
    $('levBox').hidden = heavy;                 /* heavy day: the numbers go away entirely */
    if (!heavy) {
      var rows = (D.leverage || []).filter(function (a) { return a.live > 0; }).slice(0, 9);
      $('lev').innerHTML = rows.length ? rows.map(function (a) {
        var names = (a.liveGoals || []).map(function (id) { return (byId[id] || {}).t || id; });
        return '<div class="row" data-act="' + esc(a.id) + '">' +
          '<span class="rn">' + (a.live > 1 ? '×' + a.live : '') + '</span>' +
          '<div class="rt">' + esc(a.title) + '</div>' +
          '<div class="rs">' + (a.status === 'blocked' ? 'waiting on something first · ' : '') +
          esc(names.slice(0, 3).join(' · ')) + '</div></div>';
      }).join('') : '<div class="muted">Nothing ranked yet.</div>';
    }
    var f = D.freeWins || [];
    $('freeBox').hidden = !f.length;
    $('free').innerHTML = f.map(function (g) {
      return '<div class="row" data-goal="' + esc(g.id) + '"><div class="rt">' + esc(g.t) + '</div>' +
        '<div class="rs">' + esc(g.decay || '') + '</div></div>';
    }).join('');
  }

  /* ── one goal, in full ──────────────────────────────────────────────────────────────────────── */
  function showGoal(id) {
    var g = byId[id];
    if (!g || !g.t) { return; }
    sel = id;
    $('detailBox').hidden = false;
    $('detailH').textContent = 'THIS GOAL';
    var tier = g.retired ? 'retired' : (g.status === 'achieved' ? 'already happened' : g.tier);
    var h = '<div><span class="d-tier t-' + esc(g.tier) + '">' + esc(String(tier).toUpperCase()) + '</span>' +
      /* "Nothing inferred is asserted" — the tier is a machine guess until he says otherwise. */
      (!g.confirmed && !g.retired ? '<span class="unconf" title="Machine-inferred. Nothing here is settled until you say so.">unconfirmed</span>' : '') +
      '</div><div class="rt" style="margin-top:8px;font-size:15px">' + esc(g.t) + '</div>';
    if (g.decay) h += '<div class="rs">' + esc(g.decay) + (g.n > 1 ? ' · written ' + g.n + ' times' : '') + '</div>';
    /* Provenance, in his own words. Without it an imported list is just another shelf. */
    if (g.q) h += '<div class="quote">“' + esc(g.q) + '”</div>';
    if (g.src && g.src.length) h += '<div class="src">from: ' + esc(g.src.join(' · ')) + '</div>';
    if (g.blocked) h += '<div class="note">Shown, never planned — ' + esc(g.blocked.toLowerCase()) + '.</div>';
    h += '<div class="chain" id="chain"></div>';
    h += '<div class="decide">' +
      '<button data-dec="keep">Still mine</button>' +
      '<button data-dec="retire">Retire it</button>' +
      '<button data-dec="achieved">Already happened</button>' +
      '<button data-dec="pic">🖼 Picture it</button></div>';
    h += '<div id="pic"></div>';
    $('detail').innerHTML = h;

    fetch('/api/goals/chain?id=' + encodeURIComponent(id)).then(function (r) { return r.json(); }).then(function (c) {
      var el = $('chain'); if (!el) { return; }
      if (!c.ok) { el.innerHTML = ''; return; }
      if (!c.planned) { el.innerHTML = '<div class="note">' + esc(c.why || '') + '</div>'; return; }
      /* On a heavy day the LADDER comes off. The full chain reads "then $10,000/mo, then debt cleared,
         then two years of filed returns" — every rung a thing he hasn't done, which is precisely the
         feeling the Hard Day Protocol exists to keep off the screen. What survives is what he could
         start, because that is help rather than an accounting. */
      var steps = heavy ? c.chain.filter(function (s) { return s.startable; }) : c.chain;
      el.innerHTML = '<h2 style="margin:15px 0 2px">' +
        (heavy ? 'WHERE IT STARTS' : 'WHAT IT TAKES') + '</h2>' +
        steps.map(function (s) {
          return '<div class="step ' + (s.startable ? 'go' : '') + '"><span class="dot">' +
            (s.startable ? 'START' : 'then') + '</span><span>' + esc(s.title) +
            (s.cost === 'free' ? ' · free' : '') + '</span></div>';
        }).join('');
    });
  }

  function showAction(id) {
    var a = (D.leverage || []).filter(function (x) { return x.id === id; })[0];
    if (!a) { return; }
    sel = id; $('detailBox').hidden = false; $('detailH').textContent = 'THIS ACTION';
    var names = (a.liveGoals || []).map(function (g) { return (byId[g] || {}).t || g; });
    $('detail').innerHTML = '<div class="rt" style="font-size:15px">' + esc(a.title) + '</div>' +
      '<div class="rs">' + (a.status === 'blocked' ? 'waiting on something first' : 'you can start this') +
      (a.cost === 'free' ? ' · costs nothing' : '') + '</div>' +
      (a.note ? '<div class="quote">' + esc(a.note) + '</div>' : '') +
      '<div class="note">Moves ' + a.live + ' of the goals you’re chasing' +
      (a.unlocks > a.live ? ', and ' + (a.unlocks - a.live) + ' dormant ones' : '') + '.</div>' +
      (names.length ? '<div class="chain">' + names.map(function (n) {
        return '<div class="step go"><span class="dot">→</span><span>' + esc(n) + '</span></div>'; }).join('') + '</div>' : '');
  }

  function decide(dec) {
    if (!sel) { return; }
    if (dec === 'pic') { picture(); return; }
    var keep = sel;
    fetch('/api/goals/decide', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: sel, decision: dec }) })
      .then(function (r) { return r.json(); })
      .then(function () {
        $('status').textContent = 'saved';
        fetch('/api/goals' + (heavy ? '?hardDay=1' : '')).then(function (r) { return r.json(); }).then(function (d) {
          if (d.ok) { D = d; render(); showGoal(keep); }
        });
      });
  }

  /* ONE goal at a time and only when he asks. 91 unprompted images would cost real money for pictures he
     never looks at, and the point of the image is to make a goal concrete — which only works for the few
     he is actually chasing. */
  function picture() {
    var g = byId[sel]; if (!g) { return; }
    $('pic').innerHTML = '<div class="note">drawing…</div>';
    fetch('/api/goals/image', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: g.t }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var el = $('pic'); if (!el) { return; }
        el.innerHTML = d.ok ? '<img src="' + esc(d.url) + '" alt="" />'
          : '<div class="note">' + esc(d.error || 'no image') + '</div>';
      });
  }

  /* ── the graph ──────────────────────────────────────────────────────────────────────────────── */
  function build() {
    var cats = {}; (D.categories || []).forEach(function (c) { cats[c.id] = c.color; });
    var acts = D.actions || [];
    var lev = {}; (D.leverage || []).forEach(function (a) { lev[a.id] = a; });
    var goals = (D.goals || []).filter(function (g) { return tierFilter === 'all' || g.tier === tierFilter; });

    nodes = []; edges = [];

    /* Only the actions some visible goal actually needs — otherwise every filter still draws the whole
       machine and the picture stops meaning anything. Walk the chain upward until it stops growing. */
    var need = {};
    goals.forEach(function (g) { (g.req || []).forEach(function (r) { need[r] = true; }); });
    var grew = true;
    while (grew) {
      grew = false;
      acts.forEach(function (a) {
        if (!need[a.id]) { return; }
        (a.blockedBy || []).forEach(function (b) { if (!need[b]) { need[b] = true; grew = true; } });
      });
    }

    acts.forEach(function (a) {
      if (!need[a.id]) { return; }
      var L = lev[a.id] || { live: 0, unlocks: 0 };
      /* No colour is chosen here — draw() reads the theme. Only the FACT of being blocked is recorded. */
      nodes.push({ id: a.id, kind: 'action', label: a.title, r: 7 + Math.min(16, L.live * 1.6),
        dashed: false, blocked: a.status === 'blocked', faded: a.status === 'blocked' });
    });
    goals.forEach(function (g) {
      nodes.push({ id: g.id, kind: 'goal', label: g.t, r: 4 + Math.min(9, (g.n || 1) * 1.1),
        /* his own category colours from goals.json; an uncategorised goal falls back to the theme's --dim */
        color: cats[g.cat] || theme().dim,
        /* dream tier renders dashed: present and visible, explicitly not planned */
        dashed: g.tier === 'dream', faded: !!g.blocked || !!g.retired });
      (g.req || []).forEach(function (r) { if (need[r]) { edges.push([g.id, r]); } });
    });
    acts.forEach(function (a) {
      if (!need[a.id]) { return; }
      (a.blockedBy || []).forEach(function (b) { if (need[b]) { edges.push([a.id, b]); } });
    });

    var idx = {}; nodes.forEach(function (n, i) { idx[n.id] = i; });
    edges = edges.filter(function (e) { return idx[e[0]] !== undefined && idx[e[1]] !== undefined; })
      .map(function (e) { return [idx[e[0]], idx[e[1]]]; });

    /* Deterministic start positions — a graph that lands differently on every load is disorienting. */
    nodes.forEach(function (n, i) {
      var ang = i * 2.399, rad = 40 + (i % 9) * 26;
      n.x = Math.cos(ang) * rad; n.y = Math.sin(ang) * rad; n.vx = 0; n.vy = 0;
    });
    layout();
  }

  /* A small spring layout. Sixty lines of physics beats a CDN dependency he'd have to audit. */
  function layout() {
    for (var it = 0; it < 320; it++) {
      var k = 1 - it / 340;
      for (var i = 0; i < nodes.length; i++) {
        var a = nodes[i];
        for (var j = i + 1; j < nodes.length; j++) {
          var b = nodes[j], dx = b.x - a.x, dy = b.y - a.y;
          var d2 = dx * dx + dy * dy || 0.01, d = Math.sqrt(d2);
          if (d < 300) {
            var rep = 1100 / d2;
            a.vx -= (dx / d) * rep; a.vy -= (dy / d) * rep;
            b.vx += (dx / d) * rep; b.vy += (dy / d) * rep;
          }
        }
        a.vx -= a.x * 0.0026; a.vy -= a.y * 0.0026;      /* a gentle pull toward the middle */
      }
      edges.forEach(function (e) {
        var a = nodes[e[0]], b = nodes[e[1]];
        var dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 0.01;
        var f = (d - 76) * 0.013;
        a.vx += (dx / d) * f; a.vy += (dy / d) * f; b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
      });
      nodes.forEach(function (n) { n.x += n.vx * k; n.y += n.vy * k; n.vx *= 0.82; n.vy *= 0.82; });
    }
  }

  var cv = $('cv'), ctx = cv.getContext('2d'), view = { x: 0, y: 0, s: 1 };
  function fit() {
    var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!nodes.length) { return; }
    var xs = nodes.map(function (n) { return n.x; }), ys = nodes.map(function (n) { return n.y; });
    var xMin = Math.min.apply(null, xs), xMax = Math.max.apply(null, xs);
    var yMin = Math.min.apply(null, ys), yMax = Math.max.apply(null, ys);
    view.s = Math.min(r.width / (xMax - xMin + 150), r.height / (yMax - yMin + 110), 1.7);
    view.x = r.width / 2 - ((xMax + xMin) / 2) * view.s;
    view.y = r.height / 2 - ((yMax + yMin) / 2) * view.s;
  }
  var P = function (n) { return { x: n.x * view.s + view.x, y: n.y * view.s + view.y }; };

  function draw() {
    var r = cv.getBoundingClientRect(), T = theme();
    ctx.clearRect(0, 0, r.width, r.height);
    edges.forEach(function (e) {
      var a = P(nodes[e[0]]), b = P(nodes[e[1]]);
      ctx.strokeStyle = wash(.22); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    });
    nodes.forEach(function (n) {
      var p = P(n), rr = Math.max(3, n.r * view.s);
      /* An action is the theme's own accent; a blocked one drops to --dim. Goal nodes keep the category
         colours out of his goals.json — those are HIS data, not a hex this page invented. */
      var fill = n.kind === 'action' ? (n.blocked ? T.dim : T.teal) : n.color;
      ctx.globalAlpha = n.faded ? 0.42 : 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, 6.284);
      if (n.kind === 'action') {
        ctx.fillStyle = fill; ctx.fill();
        ctx.strokeStyle = T.cream; ctx.globalAlpha = (n.faded ? 0.42 : 1) * 0.5; ctx.lineWidth = 1; ctx.stroke();
        ctx.globalAlpha = n.faded ? 0.42 : 1;
      } else if (n.dashed) {
        /* dormant: outline only, so it is present without competing for his attention */
        ctx.setLineDash([3, 3]); ctx.strokeStyle = fill; ctx.lineWidth = 1.2; ctx.stroke(); ctx.setLineDash([]);
      } else {
        ctx.fillStyle = fill; ctx.fill();
      }
      if (n.id === sel) { ctx.strokeStyle = T.cream; ctx.lineWidth = 2; ctx.stroke(); }
      ctx.globalAlpha = 1;
      /* Label the hubs only. 114 labels at once is a hairball, not a picture. */
      if (n.kind === 'action' && rr > 9) {
        ctx.fillStyle = T.cream; ctx.globalAlpha = .92;
        ctx.font = '500 11px Inter, -apple-system, Segoe UI, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(short(n.label, 26), p.x, p.y - rr - 5);
        ctx.globalAlpha = 1;
      }
    });
  }

  /* drag a node; click one to open it */
  var drag = null, moved = false;
  function at(ev) {
    var r = cv.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
    for (var i = nodes.length - 1; i >= 0; i--) {
      var p = P(nodes[i]), rr = Math.max(6, nodes[i].r * view.s);
      if ((mx - p.x) * (mx - p.x) + (my - p.y) * (my - p.y) < rr * rr + 36) { return nodes[i]; }
    }
    return null;
  }
  cv.addEventListener('pointerdown', function (e) { drag = at(e); moved = false; if (drag) { cv.setPointerCapture(e.pointerId); } });
  cv.addEventListener('pointermove', function (e) {
    if (!drag) { return; }
    moved = true;
    var r = cv.getBoundingClientRect();
    drag.x = (e.clientX - r.left - view.x) / view.s; drag.y = (e.clientY - r.top - view.y) / view.s;
    draw();
  });
  cv.addEventListener('pointerup', function () {
    if (drag && !moved) {
      if (drag.kind === 'goal') { showGoal(drag.id); } else { showAction(drag.id); }
      draw();
    }
    drag = null;
  });

  /* ── render ─────────────────────────────────────────────────────────────────────────────────── */
  function render() {
    byId = {}; (D.goals || []).forEach(function (g) { byId[g.id] = g; });
    var t = D.tiers || {};
    $('sub').textContent = heavy
      ? 'The map is here whenever you want it.'
      : t['true'] + ' yours · ' + t.operating + ' the route · ' + t.dream + ' dormant' +
        (t.retired ? ' · ' + t.retired + ' retired' : '') +
        (t.achieved ? ' · ' + t.achieved + ' done' : '') +
        ' — a big circle is an action that moves a lot of them.';
    $('status').textContent = (!heavy && D.unconfirmed) ? D.unconfirmed + ' still unconfirmed' : '';
    renderOne(); renderSide(); build(); fit(); draw();
    /* ?goal=g_ranch opens one goal directly — so "show me the ranch" can land on the thing itself
       rather than on a map he then has to search. */
    var want = new URLSearchParams(location.search).get('goal');
    if (!sel && want && byId[want]) { sel = want; }
    /* Re-draw whatever is open. Without this the panel keeps the HTML it had before the heavy-day switch,
       and the ladder it is supposed to hide stays on screen. */
    if (sel && byId[sel]) { showGoal(sel); draw(); }
  }

  document.addEventListener('click', function (e) {
    var f = e.target.closest('.f');
    if (f) {
      tierFilter = f.getAttribute('data-tier');
      var all = document.querySelectorAll('.f');
      for (var i = 0; i < all.length; i++) { all[i].classList.toggle('on', all[i] === f); }
      build(); fit(); draw(); return;
    }
    if (e.target.id === 'heavy') { heavy = !heavy; e.target.classList.toggle('on', heavy); load(); return; }
    var row = e.target.closest('[data-goal]');
    if (row) { showGoal(row.getAttribute('data-goal')); draw(); return; }
    var arow = e.target.closest('[data-act]');
    if (arow) { showAction(arow.getAttribute('data-act')); draw(); return; }
    var dec = e.target.closest('[data-dec]');
    if (dec) { decide(dec.getAttribute('data-dec')); }
  });
  window.addEventListener('resize', function () { fit(); draw(); });
  load();
})();
</script>
