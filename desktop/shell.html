<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Jarvis</title>
<style>
  :root{ --ink:#000000; --panel:#111111; --line:#2a2a2a; --teal:#ffffff; --cream:#e8e8e8; --dim:#666666; --warn:#aaaaaa; }
  *{ box-sizing:border-box; margin:0; }
  html,body{ height:100%; background:var(--ink); color:var(--cream); font-family:'Space Grotesk',system-ui,sans-serif; }
  body{ display:flex; flex-direction:column; }
  .nav{ display:flex; align-items:center; gap:10px; padding:9px 14px; background:#0a0a0a; border-bottom:1px solid var(--line); }
  .brand{ font-family:'Silkscreen',monospace; letter-spacing:.3em; color:var(--teal); font-size:13px; }
  .tab{ background:transparent; border:1px solid var(--line); color:var(--dim); border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer; font-family:inherit; transition:all .15s; }
  .tab:hover{ color:var(--cream); border-color:#555; }
  .tab.on{ color:#000000; background:var(--teal); border-color:var(--teal); font-weight:600; }
  .spacer{ flex:1; }
  .net-btns{ display:flex; align-items:center; gap:6px; }
  .net-btn{ background:transparent; border:1px solid var(--line); color:var(--dim); border-radius:6px; padding:4px 9px; font-size:11px; cursor:pointer; font-family:inherit; transition:all .15s; }
  .net-btn:hover{ color:var(--cream); border-color:#555; }
  .net-btn.active{ color:#000000; background:var(--teal); border-color:var(--teal); }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--dim); flex-shrink:0; transition:background .3s; }
  .dot.ok{ background:#ffffff; box-shadow:0 0 6px #ffffff; }
  .dot.err{ background:#888888; }
  .dot.checking{ background:var(--warn); animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }
  webview{ flex:1; border:0; }
</style>
</head>
<body>
  <div class="nav">
    <span class="brand">JARVIS</span>
    <button class="tab on" data-surface="world">World</button>
    <button class="tab" data-surface="hq">HQ</button>
    <span class="spacer"></span>
    <div class="net-btns">
      <button class="net-btn active" id="btnLan" title="Home — LAN (192.168.6.121)">🏠 Home</button>
      <button class="net-btn" id="btnVpn" title="Away — Tailscale VPN">📡 Away</button>
      <span class="dot checking" id="dot" title="checking connection…"></span>
    </div>
  </div>
  <webview id="view" allowpopups></webview>
<script>
  // World (companion) always runs locally on this PC.
  // HQ runs on the NAS — reachable via LAN when home, Tailscale when away.
  const WORLD_URL  = 'http://localhost:8095/';
  const LAN_HOST   = localStorage.getItem('jarvis-lan-host')  || '192.168.6.121';
  const VPN_HOST   = localStorage.getItem('jarvis-vpn-host')  || 'jarvis-nas'; // NAS MagicDNS name (was wrongly the PC's IP); stable across tailscale IP changes
  const HQ_PORT    = 8099;

  const view    = document.getElementById('view');
  const dot     = document.getElementById('dot');
  const btnLan  = document.getElementById('btnLan');
  const btnVpn  = document.getElementById('btnVpn');

  let surface  = 'world';
  let hqHost   = localStorage.getItem('jarvis-hq-host') || LAN_HOST;

  function hqUrl(host){ return `http://${host}:${HQ_PORT}/`; }

  function go(s){
    surface = s;
    const url = s === 'world' ? WORLD_URL : hqUrl(hqHost);
    view.src = url;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.surface === s));
  }

  function setHost(host, btn){
    hqHost = host;
    localStorage.setItem('jarvis-hq-host', host);
    btnLan.classList.toggle('active', btn === btnLan);
    btnVpn.classList.toggle('active', btn === btnVpn);
    if (surface === 'hq') go('hq');
    probe();
  }

  btnLan.addEventListener('click', () => setHost(LAN_HOST, btnLan));
  btnVpn.addEventListener('click', () => setHost(VPN_HOST, btnVpn));

  // Sync active button to current hqHost
  btnLan.classList.toggle('active', hqHost === LAN_HOST);
  btnVpn.classList.toggle('active', hqHost !== LAN_HOST);

  document.querySelectorAll('.tab').forEach(t =>
    t.addEventListener('click', () => go(t.dataset.surface))
  );

  // Auto-detect: race LAN vs VPN, switch to whichever responds first.
  // Runs once on startup, then again every 30 s to notice network changes.
  async function probe(){
    dot.className = 'dot checking';
    dot.title = 'checking connection…';
    const check = (host) => fetch(hqUrl(host) + 'api/state', { cache:'no-store', signal: AbortSignal.timeout(3000) })
      .then(r => r.ok ? host : Promise.reject())
      .catch(() => null);
    const [lan, vpn] = await Promise.all([check(LAN_HOST), check(VPN_HOST)]);
    if (lan){
      dot.className = 'dot ok'; dot.title = `HQ reachable on LAN (${LAN_HOST})`;
      if (hqHost !== LAN_HOST){ setHost(LAN_HOST, btnLan); }
    } else if (vpn){
      dot.className = 'dot ok'; dot.title = `HQ reachable via VPN (${VPN_HOST})`;
      if (hqHost !== VPN_HOST){ setHost(VPN_HOST, btnVpn); }
    } else {
      dot.className = 'dot err'; dot.title = 'HQ unreachable — NAS offline or not on network';
    }
  }

  // ── THE BLACKOUT FIX (operator, 2026-08-02: "this is jarvis 90% of the time, blacked") ────────────
  //
  // The old logic retried ONLY until the first successful load, then stopped watching. So the moment the
  // companion restarted — a crash, a redeploy, run-loop.cmd cycling it, anything — the webview's page died
  // and NOTHING ever brought it back. It sat on a blank error page until he quit and relaunched. The
  // companion restarts often, which is exactly why he saw this most of the time rather than rarely.
  //
  // Now: a failed load is a RECOVERABLE state, not a terminal one. We watch `did-fail-load`, keep probing,
  // and reload the instant the server answers again. And a black screen is never silent — he gets a visible
  // "reconnecting" line, because a blank window tells you nothing about whether to wait or restart.
  let worldReady = false, reconnecting = false;

  function setStatus(msg){
    let el = document.getElementById('reconn');
    if (!msg){ if (el) el.remove(); return; }
    if (!el){
      el = document.createElement('div');
      el.id = 'reconn';
      el.style.cssText = 'position:fixed;left:0;right:0;bottom:0;padding:9px 14px;font:12.5px/1.4 system-ui;'
        + 'background:rgba(90,190,180,.12);color:#9fd6cf;border-top:1px solid rgba(90,190,180,.35);z-index:9999;text-align:center';
      document.body.appendChild(el);
    }
    el.textContent = msg;
  }

  function probeWorld(){
    return fetch(WORLD_URL, { cache:'no-store', signal:AbortSignal.timeout(1500) }).then(r => !!r).catch(() => false);
  }

  // Poll until the companion answers, then reload the view. Backs off gently so a long outage doesn't
  // hammer the port, but stays responsive enough that a 3-second restart feels instant.
  async function recoverWorld(){
    if (reconnecting) return;
    reconnecting = true;
    let wait = 500;
    for (;;){
      if (await probeWorld()){
        setStatus(null);
        reconnecting = false;
        worldReady = true;
        if (surface === 'world') { try { view.reloadIgnoringCache(); } catch { view.src = WORLD_URL; } }
        return;
      }
      setStatus('Jarvis is starting up — reconnecting…  (Ctrl+R to force)');
      await new Promise(r => setTimeout(r, wait));
      wait = Math.min(4000, Math.round(wait * 1.4));
    }
  }

  // A load failure is the signal that matters. -3 is ABORTED (a navigation superseded by another) and is
  // normal noise, not an outage — treating it as one would put us in a reload loop.
  view.addEventListener('did-fail-load', (e) => {
    if (e.errorCode === -3) return;
    if (surface === 'world') recoverWorld();
  });
  view.addEventListener('did-finish-load', () => { if (surface === 'world') setStatus(null); });
  // The renderer dying (OOM/crash) leaves the same black window, and never fires did-fail-load.
  view.addEventListener('crashed', () => { if (surface === 'world') recoverWorld(); });
  view.addEventListener('render-process-gone', () => { if (surface === 'world') recoverWorld(); });

  function goWorld(){
    surface = 'world';
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.surface === 'world'));
    if (worldReady) { view.reloadIgnoringCache(); return; }
    view.src = WORLD_URL;      // first attempt; if the server isn't up this fails and recoverWorld takes over
    recoverWorld();
  }

  // ESCAPE HATCH for a blacked-out webview (recurring blank Home/Today/Jarvis): Ctrl/Cmd+R or F5 force-reloads
  // the inner view IGNORING cache — a one-key recovery so a stale cache never leaves the app stuck.
  window.addEventListener('keydown', (e) => {
    if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && (e.key === 'r' || e.key === 'R'))) {
      e.preventDefault();
      try { view.reloadIgnoringCache(); } catch { view.src = view.src; }
    }
  });

  goWorld();
  probe();
  setInterval(probe, 30_000);
</script>
</body>
</html>
