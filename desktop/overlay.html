<!doctype html>
<meta charset="utf-8" />
<title>Jarvis</title>
<!--
  overlay.html — the always-on-top ask panel (PRD "Jarvis Desktop Presence", build order #1).

  Operator: "I want a pop-up overlay that sits on top of my desktop so I can quickly click through it… Jarvis
  is a place he has to GO TO. Everything else is where he already IS."

  Deliberately NOT the full app in a smaller window: this is one input, one answer, then gone. It talks to the
  same companion on :8095 as everything else, so an answer here and an answer in the app can never disagree.
  Escape / click-away dismisses (main.js owns that — no preload, no node in this window).
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  #panel { height: 100%; display: flex; flex-direction: column; border-radius: 14px; overflow: hidden;
    background: rgba(8, 13, 24, .96); border: 1px solid rgba(90, 190, 180, .28);
    box-shadow: 0 18px 60px rgba(0, 0, 0, .55); }
  #bar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; -webkit-app-region: drag; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #5abeb4; flex: none; box-shadow: 0 0 10px #5abeb4; }
  #dot.busy { animation: pulse .9s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  #q { flex: 1; background: transparent; border: 0; outline: 0; color: #e8e6e1; font: inherit; font-size: 15px;
    -webkit-app-region: no-drag; }
  #q::placeholder { color: #6b7a86; }
  #hint { font-size: 10.5px; color: #5d6b77; letter-spacing: .04em; flex: none; }
  #out { flex: 1; overflow-y: auto; padding: 0 14px 12px; font-size: 13.5px; line-height: 1.55; color: #cfd6dc;
    white-space: pre-wrap; display: none; }
  #out.on { display: block; }
  #acts { padding: 0 14px 10px; font-size: 11px; color: #5abeb4; display: none; }
  #acts.on { display: block; }
  #row { display: flex; gap: 6px; padding: 0 14px 12px; -webkit-app-region: no-drag; }
  button { background: rgba(90, 190, 180, .1); border: 1px solid rgba(90, 190, 180, .26); color: #cfe9e5;
    border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 11.5px; cursor: pointer; }
  button:hover { background: rgba(90, 190, 180, .2); }
  #err { color: #e2857a; }
</style>

<div id="panel">
  <div id="bar">
    <div id="dot"></div>
    <input id="q" autocomplete="off" spellcheck="false" placeholder="Ask Jarvis…  (Enter to send · Esc to dismiss)" />
    <span id="hint">⌘/Ctrl ⇧ Space</span>
  </div>
  <div id="acts"></div>
  <div id="out"></div>
  <div id="row">
    <button id="cap">＋ Capture to vault</button>
    <button id="full">Open full Jarvis ↗</button>
  </div>
</div>

<script>
  const API = 'http://127.0.0.1:8095';
  const q = document.getElementById('q'), out = document.getElementById('out');
  const acts = document.getElementById('acts'), dot = document.getElementById('dot');
  let history = [];

  // Each summon starts a fresh ask. The overlay is for a question, not a conversation you scroll back through
  // — that is what the full app is for, and pretending otherwise would slowly turn this into a second app.
  window.addEventListener('jarvis-overlay-shown', reset);
  function reset() { history = []; q.value = ''; out.className = ''; acts.className = ''; out.textContent = ''; acts.textContent = ''; q.focus(); }

  function show(text, isErr) { out.className = 'on'; out.textContent = text; out.style.color = isErr ? '#e2857a' : '#cfd6dc'; }

  async function ask() {
    const text = q.value.trim();
    if (!text) return;
    history.push({ role: 'user', content: text });
    q.value = '';
    dot.className = 'busy';
    show('…');
    try {
      const r = await fetch(API + '/api/chat', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });
      const d = await r.json();
      if (!r.ok || d.error) { show(d.error || ('error ' + r.status), true); return; }
      const reply = d.reply || d.text || '';
      show(reply);
      history.push({ role: 'assistant', content: reply });
      // Show only VERIFIED tool results (L-014) — these come from real tool returns, never from the prose.
      const list = (d.actions || []).map((a) => (a.ok === false ? '⚠ ' : '✓ ') + (a.label || '')).filter(Boolean);
      if (list.length) { acts.className = 'on'; acts.textContent = list.join('   '); }
    } catch (e) {
      show("Can't reach Jarvis on :8095 — is the companion running?", true);
    } finally { dot.className = ''; }
  }

  q.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); } });

  document.getElementById('cap').addEventListener('click', async () => {
    const text = q.value.trim();
    if (!text) { q.focus(); return; }
    dot.className = 'busy';
    try {
      const r = await fetch(API + '/api/cockpit/capture', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }),
      });
      const d = await r.json();
      // Report the REAL result. "Captured ✓" on a failed write is exactly the lie L-014 exists to prevent.
      if (d && (d.ok || d.file)) { show('Captured to ' + (d.file || 'the vault') + ' ✓'); q.value = ''; }
      else show('Capture failed — nothing was written.' + (d && d.error ? ' ' + d.error : ''), true);
    } catch { show("Capture failed — can't reach Jarvis.", true); }
    finally { dot.className = ''; }
  });

  document.getElementById('full').addEventListener('click', () => { location.href = '#open-full'; });
  reset();
</script>
