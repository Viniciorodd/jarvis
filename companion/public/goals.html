<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Goals — Jarvis</title>
<!--
  goals.html — the filter and the router.

  Operator: "having written goals sometimes feels like writing something and putting it on a shelf and never
  seeing them again... if you're not constantly thinking about a goal, seeing it, you're not pursuing it."

  WHAT IS DRAWN. Not goals connected to goals — goals connected to the ACTIONS they need, and actions to the
  actions in front of them. That is the real shape of his registry, and it makes the finding visible instead
  of merely reported: one hub with almost everything hanging off it. His own registry put it plainly — 67 of
  91 goals sit on top of the same single unblocked action, and that action is sending.

  Node size = leverage (how many LIVE goals an action moves) for actions, and how many times he wrote it
  across ten years for goals — his own signal about what he actually wants, not mine.

  Drawn with a small spring layout in canvas: no library, nothing from a CDN, per his Repo Security Audit rule.

  TONE. The compassion clause governs every string on this page. The decay counter says when he last wrote a
  goal, never that he is late. There is no gap number, no "days behind", no progress bar against a target.
  The heavy-day switch takes even the leverage table away and leaves one thing that costs nothing.
-->
<script>try{var _t=localStorage.getItem('jarvis-theme');document.documentElement.dataset.theme=(!_t||_t==='exec')?'black':_t;}catch(e){document.documentElement.dataset.theme='black';}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* ── ON THE DESIGN SYSTEM ────────────────────────────────────────────────────────────────────────
     This page first shipped with four invented hexes and no style.css, which meant it ignored
     data-theme entirely — a black page inside the app in True White. The design system's own rule:
     "tint with rgba(var(--teal-rgb),α) — never invent a hex", and "Jet Black is canonical".

     So every colour below comes from the theme contract in style.css. The radii and the type sizes are
     the system's own values: 15px on the one thing, 14px on cards, 10px on buttons, full on anything
     selectable; 14px body, 13.5 dense rows, 12 meta, and caps labels at 10/.12em. Counts use tabular
     numerals, which the system marks "no exceptions" — a leverage table whose digits shift width as it
     re-ranks is exactly the kind of small wrongness he notices and stops trusting. */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--cream); font-family: var(--font, 'Inter', system-ui, sans-serif);
    font-size: 14px; letter-spacing: -.011em; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 22px 20px 60px; }
  a.back { display: inline-block; margin-bottom: 12px; font-size: 13px; color: var(--teal); text-decoration: none; }
  h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 600; letter-spacing: -.02em; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 16px; line-height: 1.5; }

  /* THE ONE THING — the router's answer, above everything else. 15px radius is its own token. */
  .one { border: 1px solid rgba(var(--teal-rgb),.3); background: linear-gradient(180deg, rgba(var(--teal-rgb),.10), rgba(var(--teal-rgb),.03));
    border-radius: 15px; padding: 15px 18px; margin-bottom: 16px; }
  .one .lab { font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--teal); margin-bottom: 6px; }
  .one .t { font-size: 18px; font-weight: 500; line-height: 1.35; }
  .one .why { font-size: 12px; color: var(--dim); margin-top: 7px; line-height: 1.5; }

  .bar { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; align-items: center; }
  /* chips + tabs are "anything selectable" → full radius */
  button { background: rgba(var(--teal-rgb),.1); border: 1px solid rgba(var(--teal-rgb),.28); color: var(--cream);
    border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s; }
  button:hover:not(:disabled) { background: rgba(var(--teal-rgb),.2); }
  button:disabled { opacity: .4; cursor: default; }
  button.on { background: var(--teal); color: var(--ink-on-accent); border-color: var(--teal); font-weight: 600; }
  button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .status { font-size: 12px; color: var(--dim); margin-left: auto; font-variant-numeric: tabular-nums; }

  .grid { display: grid; grid-template-columns: 1fr 360px; gap: 16px; align-items: start; }
  @media (max-width: 950px) { .grid { grid-template-columns: 1fr; } }
  #cv { width: 100%; height: 580px; display: block; border-radius: 14px; border: 1px solid var(--line);
    background: var(--panel); cursor: grab; touch-action: none; }
  #cv:active { cursor: grabbing; }

  .side { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
  .side h2 { font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--dim); margin: 0 0 10px; }
  .row { padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:last-child { border-bottom: 0; }
  .row:hover .rt { color: var(--teal); }
  .rt { font-size: 13.5px; line-height: 1.35; }
  .rn { color: var(--teal); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; float: right; margin-left: 8px; }
  .rs { font-size: 12px; color: var(--dim); margin-top: 3px; line-height: 1.45; }
  .muted { color: var(--dim); font-size: 13px; line-height: 1.55; }

  /* the detail panel */
  .d-tier { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .12em; padding: 3px 9px;
    border-radius: 999px; margin-right: 6px; background: rgba(var(--teal-rgb),.16); color: var(--teal); }
  /* Dormant reads quieter than live — the tier IS the message, so it carries no accent. */
  .t-dream { background: rgba(var(--teal-rgb),.07); color: var(--dim); }
  .unconf { border-bottom: 1px dotted var(--dim); cursor: help; font-size: 11px; color: var(--dim); }
  .quote { border-left: 2px solid rgba(var(--teal-rgb),.4); padding: 4px 0 4px 11px; margin: 10px 0; font-size: 13.5px;
    line-height: 1.55; color: var(--cream); opacity: .88; font-style: italic; }
  .chain { margin-top: 10px; }
  .step { display: flex; gap: 9px; align-items: flex-start; padding: 5px 0; font-size: 13px; line-height: 1.4; }
  .step .dot { color: var(--dim); flex: 0 0 auto; width: 46px; font-size: 10px; font-weight: 600; letter-spacing: .12em; }
  .step.go .dot { color: var(--teal); }
  .step.go { color: var(--cream); }
  .step:not(.go) { color: var(--dim); }
  .decide { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .decide button { font-size: 12px; padding: 6px 12px; }
  .src { font-size: 11px; color: var(--dim); margin-top: 8px; }
  #pic img { width: 100%; border-radius: 10px; display: block; margin-top: 11px; }
  .note { font-size: 12px; color: var(--dim); margin-top: 10px; line-height: 1.5; }

  /* ── KPI tiles — 12px radius is the system's metric-tile token ─────────────────────────────────── */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .kpi .n { font-size: 38px; font-weight: 600; line-height: 1.05; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 12px; color: var(--dim); margin-top: 4px; line-height: 1.45; }
  .kpi.hero { border-color: rgba(var(--teal-rgb),.42); }
  .kpi.hero .n { color: var(--teal); font-size: 46px; }

  /* ── view tabs ─────────────────────────────────────────────────────────────────────────────────── */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; flex-wrap: wrap; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--dim);
    font: inherit; font-size: 14px; font-weight: 500; padding: 10px 14px; cursor: pointer; min-height: 44px; }
  .tab:hover { color: var(--cream); background: none; }
  .tab[aria-selected="true"] { color: var(--cream); border-bottom-color: var(--teal); background: none; }
  input[type=search], select { background: var(--panel); border: 1px solid var(--line); color: var(--cream);
    border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; min-height: 34px; }
  input[type=search] { min-width: 190px; }
  input[type=search]:focus-visible, select:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  /* ── the goal list — v1's default view, and the one that is actually decidable ─────────────────── */
  .cat-head { font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--dim); margin: 16px 0 4px; }
  .cat-head:first-child { margin-top: 0; }
  .g-row { display: flex; gap: 11px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .g-row:hover .g-t { color: var(--teal); }
  .g-row .g-n { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; flex: 0 0 auto; width: 26px; text-align: right; }
  .g-t { font-size: 13.5px; line-height: 1.4; flex: 1 1 auto; }
  .g-m { font-size: 11.5px; color: var(--dim); margin-top: 2px; }
  .g-row.done .g-t, .g-row.gone .g-t { text-decoration: line-through; color: var(--dim); }
  .g-row.dream .g-t { color: var(--dim); }

  /* ── the shared-action bars — the PRD calls this "the whole point" ─────────────────────────────── */
  .bars { padding: 4px 0; }
  .bar-row { padding: 9px 0; cursor: pointer; }
  .bar-row:hover .b-t { color: var(--teal); }
  .b-t { font-size: 13.5px; line-height: 1.35; display: flex; justify-content: space-between; gap: 12px; }
  .b-n { color: var(--teal); font-weight: 600; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .track { height: 9px; border-radius: 999px; background: rgba(var(--teal-rgb),.10); margin-top: 6px; overflow: hidden; display: flex; }
  .fill { background: var(--teal); height: 100%; }
  /* the dormant remainder, shown but muted — it is real and it is not what should drive Monday */
  .fill.dormant { background: rgba(var(--teal-rgb),.26); }
  .b-s { font-size: 11.5px; color: var(--dim); margin-top: 5px; line-height: 1.45; }
  .stage > [hidden] { display: none; }

  /* ── THE CLIMB — bottom-up, because that is how he asked to see it ─────────────────────────────── */
  .climb { position: relative; }
  .wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .rung { position: relative; z-index: 1; padding: 0 0 20px; }
  .rung-l { font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--dim); margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px; }
  .rung-l::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .rung-cards { display: flex; flex-wrap: wrap; gap: 9px; }
  .gc { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 10px 13px;
    max-width: 260px; cursor: pointer; transition: border-color .15s, transform .15s; }
  .gc:hover { border-color: rgba(var(--teal-rgb),.5); }
  .gc.sel { border-color: var(--teal); }
  .gc.lit { border-color: rgba(var(--teal-rgb),.55); }
  .gc.dim { opacity: .35; }
  .gc-t { font-size: 13px; line-height: 1.35; }
  .gc-m { font-size: 11px; color: var(--dim); margin-top: 5px; display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
  .gc-h { font-size: 9.5px; font-weight: 600; letter-spacing: .1em; padding: 2px 7px; border-radius: 999px;
    background: rgba(var(--teal-rgb),.14); color: var(--teal); }
  .gc-b { color: var(--teal); }
  /* THE GROUND — his live position, and the thing every rung above is measured from. */
  .ground { border: 1px solid rgba(var(--teal-rgb),.32); background: linear-gradient(180deg, rgba(var(--teal-rgb),.03), rgba(var(--teal-rgb),.10));
    border-radius: 14px; padding: 13px 16px; margin-top: 4px; }
  .ground h3 { font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--teal); margin: 0 0 9px; }
  .caps { display: flex; flex-wrap: wrap; gap: 7px 18px; }
  .cap { font-size: 12px; }
  .cap b { font-variant-numeric: tabular-nums; font-weight: 600; }
  .cap i { color: var(--dim); font-style: normal; font-size: 10.5px; display: block; }
  .cap.miss b { color: var(--dim); font-weight: 400; }
  .shelf { border: 1px dashed var(--line); border-radius: 12px; padding: 12px 15px; margin-top: 12px; }
  .shelf h3 { font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--dim); margin: 0 0 8px; }
  .shelf .gc { max-width: none; border-style: dashed; }

  /* ── THE ASK — one number can move a dozen goals, so it leads ──────────────────────────────────── */
  .ask { border: 1px solid rgba(var(--teal-rgb),.32); background: rgba(var(--teal-rgb),.05);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; }
  .ask h3 { font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--teal); margin: 0 0 4px; }
  .ask p { font-size: 12.5px; color: var(--dim); margin: 0 0 11px; line-height: 1.5; }
  .ask-row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin-bottom: 7px; }
  .ask-row label { font-size: 13px; flex: 1 1 210px; }
  .ask-row label b { color: var(--teal); font-variant-numeric: tabular-nums; }
  .ask-row input { width: 130px; background: var(--panel); border: 1px solid var(--line); color: var(--cream);
    border-radius: 10px; padding: 7px 12px; font: inherit; font-size: 13px; font-variant-numeric: tabular-nums; }
  .ask-row input:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  /* ── WHAT CHANGED — the anti-shelf strip. Renders only when something actually moved. ──────────── */
  .moved { border: 1px solid var(--line); background: var(--panel); border-radius: 14px;
    padding: 12px 16px; margin-bottom: 16px; }
  .moved h3 { font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--dim); margin: 0 0 7px; }
  .moved li { font-size: 13px; line-height: 1.6; list-style: none; }
  .moved li::before { content: '→'; color: var(--teal); margin-right: 8px; }
  .moved ul { margin: 0; padding: 0; }

  /* ── generated to-dos ──────────────────────────────────────────────────────────────────────────── */
  .todos { margin-top: 12px; }
  .todo { display: flex; gap: 9px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .todo:last-child { border-bottom: 0; }
  .todo-t { flex: 1; font-size: 13px; line-height: 1.4; }
  .todo-y { font-size: 10px; font-weight: 600; letter-spacing: .1em; color: var(--warn); }
  .todo button { font-size: 11.5px; padding: 5px 11px; flex: 0 0 auto; }
  .gen { font-size: 11.5px; padding: 6px 12px; }
</style>

<div class="wrap">
  <a class="back" href="/">← Jarvis</a>
  <h1>Goals</h1>
  <div class="sub" id="sub">loading…</div>

  <div class="kpis" id="kpis" hidden>
    <div class="kpi hero"><div class="n" id="k-lev">—</div><div class="l" id="k-lev-l">goals share one unblocked action</div></div>
    <div class="kpi"><div class="n" id="k-total">—</div><div class="l">goals mapped, with full paths</div></div>
    <div class="kpi"><div class="n" id="k-free">—</div><div class="l">blocked by nothing — free today</div></div>
    <div class="kpi"><div class="n" id="k-dec">—</div><div class="l">decisions you've made</div></div>
  </div>

  <div class="one" id="one" hidden>
    <div class="lab" id="oneLab">START HERE</div>
    <div class="t" id="oneT"></div>
    <div class="why" id="oneWhy"></div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="climb" aria-selected="true">The climb</button>
    <button class="tab" role="tab" data-v="list" aria-selected="false">Every goal &amp; its path</button>
    <button class="tab" role="tab" data-v="graph" aria-selected="false">The graph</button>
    <button class="tab" role="tab" data-v="lev" aria-selected="false">Shared actions</button>
  </div>

  <div class="bar">
    <input type="search" id="q" placeholder="Search your goals…" aria-label="Search your goals" />
    <select id="sort" aria-label="Sort">
      <option value="cat">Group by category</option>
      <option value="n">Most restated first</option>
      <option value="last">Most recent first</option>
      <option value="first">Oldest first</option>
      <option value="steps">Fewest steps first</option>
    </select>
    <button data-tier="all" class="f on">Everything</button>
    <button data-tier="true" class="f">Yours</button>
    <button data-tier="operating" class="f">The route</button>
    <button data-tier="dream" class="f">Dormant</button>
    <button id="heavy" title="Shows one thing that costs nothing, and puts the numbers away.">🌙 Heavy day</button>
    <span class="status" id="status"></span>
  </div>

  <div class="grid">
    <div class="stage">
      <div id="v-climb">
        <div class="moved" id="moved" hidden></div>
        <div class="ask" id="ask" hidden></div>
        <div class="climb" id="climb"><svg class="wires" id="wires"></svg></div>
        <div class="ground" id="ground"></div>
        <div class="shelf" id="pendingShelf" hidden></div>
        <div class="shelf" id="noPathShelf" hidden></div>
      </div>
      <div id="v-list" hidden></div>
      <canvas id="cv" hidden></canvas>
      <div id="v-lev" class="bars" hidden></div>
    </div>
    <div>
      <div class="side" id="detailBox" hidden>
        <h2 id="detailH">THIS GOAL</h2>
        <div id="detail"></div>
      </div>
      <div class="side" id="freeBox" hidden>
        <h2>COSTS NOTHING · NEEDS NOBODY</h2>
        <div id="free"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var D = null, tierFilter = 'all', heavy = false, sel = null, view_ = 'climb';
  var nodes = [], edges = [], byId = {};

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function short(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

  /* Canvas can't read CSS variables, so it samples them. Without this the graph would be the one part of
     the page still painted in fixed hexes — teal strokes on a white page in True White. Re-sampled on every
     draw so a theme change repaints correctly rather than needing a reload. */
  var CSS = getComputedStyle(document.documentElement);
  function tok(name, fallback) { return (CSS.getPropertyValue(name) || '').trim() || fallback; }
  function wash(a) { return 'rgba(' + tok('--teal-rgb', '67,230,212') + ',' + a + ')'; }
  function theme() {
    CSS = getComputedStyle(document.documentElement);
    return { teal: tok('--teal', '#43e6d4'), cream: tok('--cream', '#f3f4f6'), dim: tok('--dim', '#8b909a'),
      line: tok('--line', 'rgba(255,255,255,.09)') };
  }

  /* ── load ───────────────────────────────────────────────────────────────────────────────────── */
  function load() {
    $('status').textContent = 'loading…';
    fetch('/api/goals' + (heavy ? '?hardDay=1' : ''))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) { $('sub').textContent = d.error || 'no registry found'; $('status').textContent = ''; return; }
        D = d; render(); loadLadder();
      })
      .catch(function (e) { $('status').textContent = String(e.message || e); });
  }

  /* ── the headline ───────────────────────────────────────────────────────────────────────────── */
  function renderOne() {
    var box = $('one');
    if (heavy) {
      /* Hard Day Protocol: one free win. No targets recited, no deadlines, no gap number. */
      var w = D.oneThing;
      if (!w) { box.hidden = true; return; }
      box.hidden = false;
      $('oneLab').textContent = 'ONE THING, AND IT COSTS NOTHING';
      $('oneT').textContent = w.t;
      $('oneWhy').textContent = 'No money, no permission, nobody to wait on.';
      return;
    }
    var a = D.oneThing;
    if (!a || !a.title) { box.hidden = true; return; }
    box.hidden = false;
    $('oneLab').textContent = 'START HERE';
    $('oneT').textContent = a.title;
    var names = (a.liveGoals || []).map(function (id) { var g = byId[id]; return g ? g.t : id; });
    /* The LIVE count leads. 67 sounds enormous until you notice 48 of them were written at nineteen. */
    $('oneWhy').textContent = a.live
      ? 'Moves ' + a.live + ' of the goals you’re actually chasing' +
        (a.unlocks > a.live ? ' (and ' + (a.unlocks - a.live) + ' dormant ones)' : '') + ': ' +
        names.slice(0, 4).join(' · ') + (names.length > 4 ? ' …' : '')
      : (a.note || '');
  }

  /* ── the free wins ──────────────────────────────────────────────────────────────────────────── */
  function renderSide() {
    var f = D.freeWins || [];
    $('freeBox').hidden = !f.length;
    $('free').innerHTML = f.map(function (g) {
      return '<div class="row" data-goal="' + esc(g.id) + '"><div class="rt">' + esc(g.t) + '</div>' +
        '<div class="rs">' + esc(g.decay || '') + '</div></div>';
    }).join('');
  }

  /* ── the KPI row ────────────────────────────────────────────────────────────────────────────── */
  function renderKpis() {
    /* On a heavy day the counters go with the rest of the numbers. A tile reading "0 decisions you've
       made" on a bad day is a scoreboard, and the Hard Day Protocol says no scoreboard. */
    $('kpis').hidden = heavy;
    if (heavy) { return; }
    var t = D.tiers || {}, top = (D.leverage || [])[0];
    $('k-lev').textContent = top ? top.live : '—';
    $('k-lev-l').innerHTML = top
      ? 'goals share one unblocked action: <strong>' + esc(short(top.title.split(' (')[0], 34)) + '</strong>'
      : 'goals share one unblocked action';
    $('k-total').textContent = (D.goals || []).length;
    $('k-free').textContent = (D.freeWins || []).length;
    $('k-dec').textContent = (D.goals || []).length - (D.unconfirmed || 0);
  }

  /* ── EVERY GOAL & ITS PATH — the default view ───────────────────────────────────────────────────
     v1 opened on the list, not the graph, and that was the right call. The graph shows him THAT
     everything converges; the list is what he can actually read down and decide on. A hairball is a
     finding, not a workspace. */
  function goalSteps(g) { return (g.req || []).length; }
  function renderList() {
    var q = ($('q').value || '').toLowerCase().trim();
    var sort = $('sort').value;
    var list = (D.goals || []).filter(function (g) {
      if (tierFilter !== 'all' && g.tier !== tierFilter) { return false; }
      if (!q) { return true; }
      return (String(g.t || '') + ' ' + String(g.q || '') + ' ' + String(g.cat || '')).toLowerCase().indexOf(q) >= 0;
    });
    var catName = {}; (D.categories || []).forEach(function (c) { catName[c.id] = c.label; });
    var cmp = {
      n: function (a, b) { return (b.n || 0) - (a.n || 0); },
      last: function (a, b) { return String(b.last || '').localeCompare(String(a.last || '')); },
      first: function (a, b) { return String(a.first || '').localeCompare(String(b.first || '')); },
      steps: function (a, b) { return goalSteps(a) - goalSteps(b); },
    }[sort];
    var html = '';
    if (sort === 'cat') {
      var groups = {};
      list.forEach(function (g) { (groups[g.cat] = groups[g.cat] || []).push(g); });
      Object.keys(groups).forEach(function (c) {
        html += '<div class="cat-head">' + esc((catName[c] || c || 'other').toUpperCase()) + '</div>';
        groups[c].sort(function (a, b) { return (b.n || 0) - (a.n || 0); }).forEach(function (g) { html += rowFor(g); });
      });
    } else {
      list.slice().sort(cmp).forEach(function (g) { html += rowFor(g); });
    }
    $('v-list').innerHTML = html || '<div class="muted">Nothing matches that.</div>';
    $('status').textContent = heavy ? '' : (list.length + ' of ' + (D.goals || []).length +
      ((D.unconfirmed && !q) ? ' · ' + D.unconfirmed + ' unconfirmed' : ''));
  }
  function rowFor(g) {
    var cls = 'g-row' + (g.tier === 'dream' ? ' dream' : '') + (g.retired ? ' gone' : '') +
      (g.status === 'achieved' ? ' done' : '');
    var steps = goalSteps(g);
    var meta = [];
    if (g.decay) { meta.push(g.decay); }
    if (g.n > 1) { meta.push('written ' + g.n + '×'); }
    /* An unmodelled goal says so rather than looking like a goal that needs nothing. */
    meta.push(g.blocked ? g.blocked.toLowerCase() : (steps ? steps + (steps === 1 ? ' step' : ' steps') : 'no chain yet'));
    return '<div class="' + cls + '" data-goal="' + esc(g.id) + '">' +
      '<span class="g-n">' + (g.n || 1) + '×</span>' +
      '<span><span class="g-t">' + esc(g.t) + '</span>' +
      '<div class="g-m">' + esc(meta.join(' · ')) + '</div></span></div>';
  }

  /* ── SHARED ACTIONS — the bar chart the PRD calls "the whole point" ──────────────────────────── */
  function renderBars() {
    var rows = (D.leverage || []).filter(function (a) { return a.unlocks > 0; });
    var max = rows.length ? Math.max.apply(null, rows.map(function (a) { return a.unlocks; })) : 1;
    $('v-lev').innerHTML = rows.length ? rows.map(function (a) {
      var names = (a.liveGoals || []).map(function (id) { return (byId[id] || {}).t || id; });
      var dormant = a.unlocks - a.live;
      return '<div class="bar-row" data-act="' + esc(a.id) + '">' +
        '<div class="b-t"><span>' + esc(a.title) + '</span>' +
        '<span class="b-n">' + a.live + (dormant ? ' <span style="opacity:.5">+' + dormant + '</span>' : '') + '</span></div>' +
        '<div class="track">' +
          '<span class="fill" style="width:' + (a.live / max * 100).toFixed(1) + '%"></span>' +
          '<span class="fill dormant" style="width:' + (dormant / max * 100).toFixed(1) + '%"></span>' +
        '</div>' +
        '<div class="b-s">' + (a.status === 'blocked' ? 'waiting on something first · ' : (a.cost === 'free' ? 'costs nothing · ' : 'you can start this · ')) +
        esc(names.slice(0, 3).join(' · ')) + '</div></div>';
    }).join('') +
      '<div class="note">Solid = goals you\'re chasing. Faint = dormant ones from the dream tier.</div>'
      : '<div class="muted">Nothing ranked yet.</div>';
  }

  /* ── THE CLIMB ──────────────────────────────────────────────────────────────────────────────────
     Operator: *"I like graph views connecting from the bottom up, and then we have to look at my current
     reality."* So the ground is his live position and the rungs rise from it. Height is not the horizon he
     typed — it is computed from the capability gap, which is why the ladder re-draws itself as he moves.

     Wires are drawn only for the SELECTED goal. Twenty-eight nodes with every edge showing is the hairball
     he already told me reads as noise; one chain at a time is a climb you can follow. */
  var LAD = null;
  function loadLadder() {
    fetch('/api/goals/ladder').then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) { $('climb').innerHTML = '<div class="muted">' + esc(d.error || 'no ladder') + '</div>'; return; }
      LAD = d; renderClimb();
    }).catch(function (e) { $('climb').innerHTML = '<div class="muted">' + esc(e.message) + '</div>'; });
  }

  function capLine(cap, r, meta) {
    var v = r.value === true ? 'yes' : (r.value === false ? 'no' : r.value);
    return '<div class="cap"><b>' + (r.partial ? '≥' : '') + esc(v) + '</b> ' + esc(meta.label) +
      '<i>' + esc(r.source) + (r.partial ? ' · partial' : '') + '</i></div>';
  }

  function cardFor(g, extra) {
    var bits = [];
    if (g.horizon) { bits.push('<span class="gc-h">' + esc(g.horizon) + '</span>'); }
    if (g.brings && g.brings.length) { bits.push('<span class="gc-b">⇒ brings ' + g.brings.length + '</span>'); }
    if (extra) { bits.push('<span>' + esc(extra) + '</span>'); }
    return '<div class="gc" data-goal="' + esc(g.id) + '" data-gid="' + esc(g.id) + '">' +
      '<div class="gc-t">' + esc(g.t) + '</div>' +
      (bits.length ? '<div class="gc-m">' + bits.join('') + '</div>' : '') + '</div>';
  }

  function renderClimb() {
    if (!LAD) { return; }
    var caps = LAD.caps || {};

    /* WHAT MOVED since he last looked. Renders ONLY when something did — "never fill silence". */
    var mv = LAD.changed;
    $('moved').hidden = heavy || !mv || !mv.lines.length;
    if (!heavy && mv && mv.lines.length) {
      $('moved').innerHTML = '<h3>SINCE ' + esc(mv.since || 'LAST TIME') + '</h3><ul>' +
        mv.lines.slice(0, 6).map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>';
    }

    /* THE ASK. Right now the single most useful thing this engine knows is which number it is missing:
       seven of his goals cannot be placed for want of a liquid-capital figure. Saying "12 goals pending" and
       leaving it there would be a diagnosis with no remedy, so the remedy is right here — type it in. */
    var blk = (LAD.blocking || []).filter(function (b) { return b.blocks > 1; });
    $('ask').hidden = heavy || !blk.length;
    if (!heavy && blk.length) {
      $('ask').innerHTML = '<h3>THE LADDER IS WAITING ON YOU</h3>' +
        '<p>These aren’t goals — they’re numbers Jarvis has never been told. ' +
        'Each one places the goals stacked behind it.</p>' +
        blk.map(function (b) {
          return '<div class="ask-row"><label for="ask-' + esc(b.cap) + '"><b>' + b.blocks + '</b> goals waiting on your ' +
            esc(b.label.toLowerCase()) + ' <span style="opacity:.6">(' + esc(b.why) + ')</span></label>' +
            '<input id="ask-' + esc(b.cap) + '" data-cap="' + esc(b.cap) + '" type="number" inputmode="decimal" ' +
            'placeholder="' + esc(b.unit) + '" aria-label="' + esc(b.label) + '" /></div>';
        }).join('');
    }
    // Rungs render HIGHEST FIRST so the page reads bottom-up: the ground sits under everything.
    var rungs = (LAD.rungs || []).slice().sort(function (a, b) { return b.rung - a.rung; });
    var html = '<svg class="wires" id="wires"></svg>';
    rungs.forEach(function (r) {
      html += '<div class="rung" data-rung="' + r.rung + '"><div class="rung-l">' +
        (r.rung === 1 ? 'WITHIN REACH TODAY' : 'AFTER ' + (r.rung - 1) + ' STEP' + (r.rung > 2 ? 'S' : '')) +
        '</div><div class="rung-cards">' + r.goals.map(function (g) { return cardFor(g); }).join('') + '</div></div>';
    });
    $('climb').innerHTML = html || '<div class="muted">Nothing placed yet.</div>';

    // THE GROUND — every number carries where it came from, so he can tell a fact from an estimate.
    var known = Object.keys(LAD.reality || {});
    $('ground').innerHTML = '<h3>WHERE YOU STAND TODAY</h3><div class="caps">' +
      known.map(function (c) { return capLine(c, LAD.reality[c], caps[c] || { label: c }); }).join('') +
      (LAD.unknown || []).map(function (c) {
        return '<div class="cap miss"><b>—</b> ' + esc((caps[c] || {}).label || c) + '<i>not measured</i></div>';
      }).join('') + '</div>';

    /* Two shelves that exist so the ladder never lies. A goal nothing produces must not sit on rung 1
       looking startable, and a goal whose numbers were never pulled is not the same as one out of reach. */
    var pend = LAD.pending || [];
    $('pendingShelf').hidden = !pend.length;
    if (pend.length) {
      $('pendingShelf').innerHTML = '<h3>WAITING ON A NUMBER — ' + pend.length + '</h3><div class="rung-cards">' +
        pend.map(function (g) {
          var need = [];
          if (g.needsMeasuring && g.needsMeasuring.length) { need.push('look up ' + g.needsMeasuring.map(function (c) { return (caps[c] || {}).label || c; }).join(', ')); }
          if (g.needsCompleting && g.needsCompleting.length) { need.push('complete ' + g.needsCompleting.map(function (c) { return (caps[c] || {}).label || c; }).join(', ')); }
          return cardFor(g, need.join(' · '));
        }).join('') + '</div>';
    }
    var np = LAD.noPath || [];
    $('noPathShelf').hidden = !np.length;
    if (np.length) {
      $('noPathShelf').innerHTML = '<h3>NO PATH MODELLED YET — ' + np.length + '</h3><div class="rung-cards">' +
        np.map(function (g) { return cardFor(g, 'nothing here produces what it needs'); }).join('') + '</div>';
    }
    wires();
  }

  /* Draw the selected goal's chain: what has to come first, and what it brings along. */
  function wires() {
    var svg = $('wires'); if (!svg || !LAD) { return; }
    var box = $('climb').getBoundingClientRect();
    svg.setAttribute('viewBox', '0 0 ' + Math.round(box.width) + ' ' + Math.round(box.height));
    var cards = {};
    var all = $('climb').querySelectorAll('.gc');
    for (var i = 0; i < all.length; i++) {
      all[i].classList.remove('sel', 'lit', 'dim');
      cards[all[i].getAttribute('data-gid')] = all[i];
    }
    if (!sel || !cards[sel]) { svg.innerHTML = ''; return; }
    var mine = (LAD.edges || []).filter(function (e) { return e.from === sel || e.to === sel; });
    var touched = {}; touched[sel] = 1;
    mine.forEach(function (e) { touched[e.from] = 1; touched[e.to] = 1; });
    for (var id in cards) { cards[id].classList.add(touched[id] ? 'lit' : 'dim'); }
    cards[sel].classList.remove('lit'); cards[sel].classList.add('sel');
    var at = function (el) { var r = el.getBoundingClientRect();
      return { x: r.left - box.left + r.width / 2, y: r.top - box.top + r.height / 2 }; };
    var out = '';
    mine.forEach(function (e) {
      var a = cards[e.from], b = cards[e.to];
      if (!a || !b) { return; }
      var p = at(a), q = at(b);
      // `affords` is the payoff edge — dashed, because it is something he gets rather than something he does.
      out += '<path d="M' + p.x + ' ' + p.y + ' C' + p.x + ' ' + ((p.y + q.y) / 2) + ' ' + q.x + ' ' + ((p.y + q.y) / 2) + ' ' + q.x + ' ' + q.y + '" ' +
        'fill="none" stroke="' + (e.kind === 'affords' ? 'rgba(var(--teal-rgb),.75)' : 'rgba(var(--teal-rgb),.35)') + '" ' +
        'stroke-width="1.5"' + (e.kind === 'affords' ? ' stroke-dasharray="4 3"' : '') + ' />';
    });
    svg.innerHTML = out;
  }

  /* ── views ──────────────────────────────────────────────────────────────────────────────────── */
  function setView(v) {
    view_ = v;
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) { tabs[i].setAttribute('aria-selected', String(tabs[i].getAttribute('data-v') === v)); }
    $('v-climb').hidden = v !== 'climb';
    $('v-list').hidden = v !== 'list';
    $('cv').hidden = v !== 'graph';
    $('v-lev').hidden = v !== 'lev';
    if (v === 'climb') { wires(); }
    /* the canvas can only be measured once it is visible */
    if (v === 'graph') { fit(); draw(); }
  }

  /* ── one goal, in full ──────────────────────────────────────────────────────────────────────── */
  function showGoal(id) {
    var g = byId[id];
    if (!g || !g.t) { return; }
    sel = id;
    $('detailBox').hidden = false;
    $('detailH').textContent = 'THIS GOAL';
    var tier = g.retired ? 'retired' : (g.status === 'achieved' ? 'already happened' : g.tier);
    var h = '<div><span class="d-tier t-' + esc(g.tier) + '">' + esc(String(tier).toUpperCase()) + '</span>' +
      /* "Nothing inferred is asserted" — the tier is a machine guess until he says otherwise. */
      (!g.confirmed && !g.retired ? '<span class="unconf" title="Machine-inferred. Nothing here is settled until you say so.">unconfirmed</span>' : '') +
      '</div><div class="rt" style="margin-top:8px;font-size:15px">' + esc(g.t) + '</div>';
    if (g.decay) h += '<div class="rs">' + esc(g.decay) + (g.n > 1 ? ' · written ' + g.n + ' times' : '') + '</div>';
    /* Provenance, in his own words. Without it an imported list is just another shelf. */
    if (g.q) h += '<div class="quote">“' + esc(g.q) + '”</div>';
    if (g.src && g.src.length) h += '<div class="src">from: ' + esc(g.src.join(' · ')) + '</div>';
    if (g.blocked) h += '<div class="note">Shown, never planned — ' + esc(g.blocked.toLowerCase()) + '.</div>';
    h += '<div class="chain" id="chain"></div>';
    h += '<div class="decide">' +
      '<button data-dec="keep">Still mine</button>' +
      '<button data-dec="retire">Retire it</button>' +
      '<button data-dec="achieved">Already happened</button>' +
      '<button data-dec="pic">🖼 Picture it</button>' +
      (g.tier === 'dream' ? '' : '<button class="gen" data-dec="todos">⚡ What do I do this week?</button>') +
      '</div>';
    h += '<div id="todos" class="todos"></div><div id="pic"></div>';
    $('detail').innerHTML = h;

    wires();
    fetch('/api/goals/chain?id=' + encodeURIComponent(id)).then(function (r) { return r.json(); }).then(function (c) {
      var el = $('chain'); if (!el) { return; }
      if (!c.ok) { el.innerHTML = ''; return; }
      if (!c.planned) { el.innerHTML = '<div class="note">' + esc(c.why || '') + '</div>'; return; }
      /* On a heavy day the LADDER comes off. The full chain reads "then $10,000/mo, then debt cleared,
         then two years of filed returns" — every rung a thing he hasn't done, which is precisely the
         feeling the Hard Day Protocol exists to keep off the screen. What survives is what he could
         start, because that is help rather than an accounting. */
      var steps = heavy ? c.chain.filter(function (s) { return s.startable; }) : c.chain;
      el.innerHTML = '<h2 style="margin:15px 0 2px">' +
        (heavy ? 'WHERE IT STARTS' : 'WHAT IT TAKES') + '</h2>' +
        steps.map(function (s) {
          return '<div class="step ' + (s.startable ? 'go' : '') + '"><span class="dot">' +
            (s.startable ? 'START' : 'then') + '</span><span>' + esc(s.title) +
            (s.cost === 'free' ? ' · free' : '') + '</span></div>';
        }).join('');
    });
  }

  function showAction(id) {
    var a = (D.leverage || []).filter(function (x) { return x.id === id; })[0];
    if (!a) { return; }
    sel = id; $('detailBox').hidden = false; $('detailH').textContent = 'THIS ACTION';
    var names = (a.liveGoals || []).map(function (g) { return (byId[g] || {}).t || g; });
    $('detail').innerHTML = '<div class="rt" style="font-size:15px">' + esc(a.title) + '</div>' +
      '<div class="rs">' + (a.status === 'blocked' ? 'waiting on something first' : 'you can start this') +
      (a.cost === 'free' ? ' · costs nothing' : '') + '</div>' +
      (a.note ? '<div class="quote">' + esc(a.note) + '</div>' : '') +
      '<div class="note">Moves ' + a.live + ' of the goals you’re chasing' +
      (a.unlocks > a.live ? ', and ' + (a.unlocks - a.live) + ' dormant ones' : '') + '.</div>' +
      (names.length ? '<div class="chain">' + names.map(function (n) {
        return '<div class="step go"><span class="dot">→</span><span>' + esc(n) + '</span></div>'; }).join('') + '</div>' : '');
  }

  function decide(dec) {
    if (!sel) { return; }
    if (dec === 'pic') { picture(); return; }
    if (dec === 'todos') { generate(); return; }
    var keep = sel;
    fetch('/api/goals/decide', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: sel, decision: dec }) })
      .then(function (r) { return r.json(); })
      .then(function () {
        $('status').textContent = 'saved';
        fetch('/api/goals' + (heavy ? '?hardDay=1' : '')).then(function (r) { return r.json(); }).then(function (d) {
          if (d.ok) { D = d; render(); showGoal(keep); }
        });
      });
  }

  /* GENERATE TO-DOS FROM THE GAP — phase 4. Every suggestion has already passed the boundary gate, the
     crisis list and the fabricated-contact check server-side; what arrives here is what survived. Nothing is
     written to his vault until he presses Add. */
  function generate() {
    var g = byId[sel]; if (!g) { return; }
    $('todos').innerHTML = '<div class="note">working out the next step…</div>';
    fetch('/api/goals/tasks', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: sel }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var el = $('todos'); if (!el) { return; }
        if (!d.ok) { el.innerHTML = '<div class="note">' + esc(d.error) + '</div>'; return; }
        if (!d.tasks.length) {
          el.innerHTML = '<div class="note">' + esc(d.note || 'Nothing survived the boundary check this round.') +
            (d.refused && d.refused.length ? ' (' + d.refused.length + ' refused)' : '') + '</div>';
          return;
        }
        el.innerHTML = '<h2 style="margin:15px 0 2px;font-size:10.5px;letter-spacing:.12em;color:#7d8b96;font-weight:600">' +
          'THIS WEEK — TO MOVE ' + esc(d.gap.label.toUpperCase()) + '</h2>' +
          d.tasks.map(function (t, i) {
            return '<div class="todo"><span class="todo-t">' + esc(t.text) +
              (t.yours ? ' <span class="todo-y">YOURS TO PRESS</span>' : '') + '</span>' +
              '<button data-add="' + i + '">Add</button></div>';
          }).join('') +
          (d.refused && d.refused.length ? '<div class="note">' + d.refused.length +
            ' suggestion' + (d.refused.length > 1 ? 's' : '') + ' refused: ' +
            esc(d.refused.map(function (r) { return r.why; }).join(', ')) + '</div>' : '');
        el._tasks = d.tasks; el._due = d.due; el._tier = g.tier;
      });
  }

  /* ONE goal at a time and only when he asks. 91 unprompted images would cost real money for pictures he
     never looks at, and the point of the image is to make a goal concrete — which only works for the few
     he is actually chasing. */
  function picture() {
    var g = byId[sel]; if (!g) { return; }
    $('pic').innerHTML = '<div class="note">drawing…</div>';
    fetch('/api/goals/image', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: g.t }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var el = $('pic'); if (!el) { return; }
        el.innerHTML = d.ok ? '<img src="' + esc(d.url) + '" alt="" />'
          : '<div class="note">' + esc(d.error || 'no image') + '</div>';
      });
  }

  /* ── the graph ──────────────────────────────────────────────────────────────────────────────── */
  function build() {
    var cats = {}; (D.categories || []).forEach(function (c) { cats[c.id] = c.color; });
    var acts = D.actions || [];
    var lev = {}; (D.leverage || []).forEach(function (a) { lev[a.id] = a; });
    var goals = (D.goals || []).filter(function (g) { return tierFilter === 'all' || g.tier === tierFilter; });

    nodes = []; edges = [];

    /* Only the actions some visible goal actually needs — otherwise every filter still draws the whole
       machine and the picture stops meaning anything. Walk the chain upward until it stops growing. */
    var need = {};
    goals.forEach(function (g) { (g.req || []).forEach(function (r) { need[r] = true; }); });
    var grew = true;
    while (grew) {
      grew = false;
      acts.forEach(function (a) {
        if (!need[a.id]) { return; }
        (a.blockedBy || []).forEach(function (b) { if (!need[b]) { need[b] = true; grew = true; } });
      });
    }

    acts.forEach(function (a) {
      if (!need[a.id]) { return; }
      var L = lev[a.id] || { live: 0, unlocks: 0 };
      /* No colour is chosen here — draw() reads the theme. Only the FACT of being blocked is recorded. */
      nodes.push({ id: a.id, kind: 'action', label: a.title, r: 7 + Math.min(16, L.live * 1.6),
        dashed: false, blocked: a.status === 'blocked', faded: a.status === 'blocked' });
    });
    goals.forEach(function (g) {
      nodes.push({ id: g.id, kind: 'goal', label: g.t, r: 4 + Math.min(9, (g.n || 1) * 1.1),
        /* his own category colours from goals.json; an uncategorised goal falls back to the theme's --dim */
        color: cats[g.cat] || theme().dim,
        /* dream tier renders dashed: present and visible, explicitly not planned */
        dashed: g.tier === 'dream', faded: !!g.blocked || !!g.retired });
      (g.req || []).forEach(function (r) { if (need[r]) { edges.push([g.id, r]); } });
    });
    acts.forEach(function (a) {
      if (!need[a.id]) { return; }
      (a.blockedBy || []).forEach(function (b) { if (need[b]) { edges.push([a.id, b]); } });
    });

    var idx = {}; nodes.forEach(function (n, i) { idx[n.id] = i; });
    edges = edges.filter(function (e) { return idx[e[0]] !== undefined && idx[e[1]] !== undefined; })
      .map(function (e) { return [idx[e[0]], idx[e[1]]]; });

    /* Deterministic start positions — a graph that lands differently on every load is disorienting. */
    nodes.forEach(function (n, i) {
      var ang = i * 2.399, rad = 40 + (i % 9) * 26;
      n.x = Math.cos(ang) * rad; n.y = Math.sin(ang) * rad; n.vx = 0; n.vy = 0;
    });
    layout();
  }

  /* A small spring layout. Sixty lines of physics beats a CDN dependency he'd have to audit. */
  function layout() {
    for (var it = 0; it < 320; it++) {
      var k = 1 - it / 340;
      for (var i = 0; i < nodes.length; i++) {
        var a = nodes[i];
        for (var j = i + 1; j < nodes.length; j++) {
          var b = nodes[j], dx = b.x - a.x, dy = b.y - a.y;
          var d2 = dx * dx + dy * dy || 0.01, d = Math.sqrt(d2);
          if (d < 300) {
            var rep = 1100 / d2;
            a.vx -= (dx / d) * rep; a.vy -= (dy / d) * rep;
            b.vx += (dx / d) * rep; b.vy += (dy / d) * rep;
          }
        }
        a.vx -= a.x * 0.0026; a.vy -= a.y * 0.0026;      /* a gentle pull toward the middle */
      }
      edges.forEach(function (e) {
        var a = nodes[e[0]], b = nodes[e[1]];
        var dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 0.01;
        var f = (d - 76) * 0.013;
        a.vx += (dx / d) * f; a.vy += (dy / d) * f; b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
      });
      nodes.forEach(function (n) { n.x += n.vx * k; n.y += n.vy * k; n.vx *= 0.82; n.vy *= 0.82; });
    }
  }

  var cv = $('cv'), ctx = cv.getContext('2d'), view = { x: 0, y: 0, s: 1 };
  function fit() {
    var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!nodes.length) { return; }
    var xs = nodes.map(function (n) { return n.x; }), ys = nodes.map(function (n) { return n.y; });
    var xMin = Math.min.apply(null, xs), xMax = Math.max.apply(null, xs);
    var yMin = Math.min.apply(null, ys), yMax = Math.max.apply(null, ys);
    view.s = Math.min(r.width / (xMax - xMin + 150), r.height / (yMax - yMin + 110), 1.7);
    view.x = r.width / 2 - ((xMax + xMin) / 2) * view.s;
    view.y = r.height / 2 - ((yMax + yMin) / 2) * view.s;
  }
  var P = function (n) { return { x: n.x * view.s + view.x, y: n.y * view.s + view.y }; };

  function draw() {
    var r = cv.getBoundingClientRect(), T = theme();
    ctx.clearRect(0, 0, r.width, r.height);
    edges.forEach(function (e) {
      var a = P(nodes[e[0]]), b = P(nodes[e[1]]);
      ctx.strokeStyle = wash(.22); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    });
    nodes.forEach(function (n) {
      var p = P(n), rr = Math.max(3, n.r * view.s);
      /* An action is the theme's own accent; a blocked one drops to --dim. Goal nodes keep the category
         colours out of his goals.json — those are HIS data, not a hex this page invented. */
      var fill = n.kind === 'action' ? (n.blocked ? T.dim : T.teal) : n.color;
      ctx.globalAlpha = n.faded ? 0.42 : 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, 6.284);
      if (n.kind === 'action') {
        ctx.fillStyle = fill; ctx.fill();
        ctx.strokeStyle = T.cream; ctx.globalAlpha = (n.faded ? 0.42 : 1) * 0.5; ctx.lineWidth = 1; ctx.stroke();
        ctx.globalAlpha = n.faded ? 0.42 : 1;
      } else if (n.dashed) {
        /* dormant: outline only, so it is present without competing for his attention */
        ctx.setLineDash([3, 3]); ctx.strokeStyle = fill; ctx.lineWidth = 1.2; ctx.stroke(); ctx.setLineDash([]);
      } else {
        ctx.fillStyle = fill; ctx.fill();
      }
      if (n.id === sel) { ctx.strokeStyle = T.cream; ctx.lineWidth = 2; ctx.stroke(); }
      ctx.globalAlpha = 1;
      /* Label the hubs only. 114 labels at once is a hairball, not a picture. */
      if (n.kind === 'action' && rr > 9) {
        ctx.fillStyle = T.cream; ctx.globalAlpha = .92;
        ctx.font = '500 11px Inter, -apple-system, Segoe UI, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(short(n.label, 26), p.x, p.y - rr - 5);
        ctx.globalAlpha = 1;
      }
    });
  }

  /* drag a node; click one to open it */
  var drag = null, moved = false;
  function at(ev) {
    var r = cv.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
    for (var i = nodes.length - 1; i >= 0; i--) {
      var p = P(nodes[i]), rr = Math.max(6, nodes[i].r * view.s);
      if ((mx - p.x) * (mx - p.x) + (my - p.y) * (my - p.y) < rr * rr + 36) { return nodes[i]; }
    }
    return null;
  }
  cv.addEventListener('pointerdown', function (e) { drag = at(e); moved = false; if (drag) { cv.setPointerCapture(e.pointerId); } });
  cv.addEventListener('pointermove', function (e) {
    if (!drag) { return; }
    moved = true;
    var r = cv.getBoundingClientRect();
    drag.x = (e.clientX - r.left - view.x) / view.s; drag.y = (e.clientY - r.top - view.y) / view.s;
    draw();
  });
  cv.addEventListener('pointerup', function () {
    if (drag && !moved) {
      if (drag.kind === 'goal') { showGoal(drag.id); } else { showAction(drag.id); }
      draw();
    }
    drag = null;
  });

  /* ── render ─────────────────────────────────────────────────────────────────────────────────── */
  function render() {
    byId = {}; (D.goals || []).forEach(function (g) { byId[g.id] = g; });
    var t = D.tiers || {};
    $('sub').textContent = heavy
      ? 'The map is here whenever you want it.'
      : t['true'] + ' yours · ' + t.operating + ' the route · ' + t.dream + ' dormant' +
        (t.retired ? ' · ' + t.retired + ' retired' : '') +
        (t.achieved ? ' · ' + t.achieved + ' done' : '') +
        ' — nothing has been removed. You decide.';
    renderOne(); renderKpis(); renderSide(); renderList(); renderBars(); build(); setView(view_);
    /* ?goal=g_ranch opens one goal directly — so "show me the ranch" can land on the thing itself
       rather than on a map he then has to search. */
    var want = new URLSearchParams(location.search).get('goal');
    if (!sel && want && byId[want]) { sel = want; }
    /* Re-draw whatever is open. Without this the panel keeps the HTML it had before the heavy-day switch,
       and the ladder it is supposed to hide stays on screen. */
    if (sel && byId[sel]) { showGoal(sel); draw(); }
  }

  document.addEventListener('click', function (e) {
    var tab = e.target.closest('.tab');
    if (tab) { setView(tab.getAttribute('data-v')); return; }
    var f = e.target.closest('.f');
    if (f) {
      tierFilter = f.getAttribute('data-tier');
      var all = document.querySelectorAll('.f');
      for (var i = 0; i < all.length; i++) { all[i].classList.toggle('on', all[i] === f); }
      renderList(); build(); if (view_ === 'graph') { fit(); draw(); } return;
    }
    if (e.target.id === 'heavy') { heavy = !heavy; e.target.classList.toggle('on', heavy); load(); return; }
    var row = e.target.closest('[data-goal]');
    if (row) { showGoal(row.getAttribute('data-goal')); draw(); return; }
    var arow = e.target.closest('[data-act]');
    if (arow) { showAction(arow.getAttribute('data-act')); draw(); return; }
    var add = e.target.closest('[data-add]');
    if (add) {
      var el = $('todos'), t = (el._tasks || [])[Number(add.getAttribute('data-add'))];
      if (!t) { return; }
      add.disabled = true; add.textContent = '…';
      fetch('/api/goals/tasks/accept', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: t.text, due: el._due, tier: el._tier }) })
        .then(function (r) { return r.json(); })
        .then(function (d) { add.textContent = d.ok ? '✓ added' : 'refused'; });
      return;
    }
    var dec = e.target.closest('[data-dec]');
    if (dec) { decide(dec.getAttribute('data-dec')); }
  });
  /* Enter commits. He is typing his own bank balance — a Save button would just be one more thing to press. */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') { return; }
    var inp = e.target.closest('#ask input[data-cap]'); if (!inp) { return; }
    var v = inp.value.trim(); if (!v) { return; }
    inp.disabled = true;
    fetch('/api/goals/reality/set', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cap: inp.getAttribute('data-cap'), value: Number(v) }) })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d.ok) { loadLadder(); } else { inp.disabled = false; } })
      .catch(function () { inp.disabled = false; });
  });
  $('q').addEventListener('input', function () { renderList(); if (view_ !== 'list') { setView('list'); } });
  $('sort').addEventListener('change', renderList);
  window.addEventListener('resize', function () { if (view_ === 'graph') { fit(); draw(); } else if (view_ === 'climb') { wires(); } });
  load();
})();
</script>
