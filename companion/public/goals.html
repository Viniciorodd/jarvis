<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Goals — Jarvis</title>
<!--
  goals.html — ten years of goals, as a picture.

  Operator: "having written goals sometimes feels like writing something and putting it on a shelf and never
  seeing them again... I would like to have a visualization, not only images, but also connections."

  The graph is drawn with a small force layout in canvas — no library, nothing from a CDN (his Repo Security
  Audit rule). Node size = how often he wrote it over ten years, because that is his own signal about what he
  actually wants. Edges = a shared prerequisite, which is the whole insight: a jet and a Lamborghini are the
  same problem underneath.
-->
<style>
  :root { --teal-rgb: 90,190,180; --teal: #5abeb4; --cream: #e8e6e1; --dim: #7d8b96; }
  body { margin: 0; background: #04070f; color: var(--cream); font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 22px 20px 60px; }
  a.back { display: inline-block; margin-bottom: 12px; font-size: 12.5px; color: var(--teal); text-decoration: none; opacity: .85; }
  h1 { font-size: 21px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
  button { background: rgba(var(--teal-rgb),.1); border: 1px solid rgba(var(--teal-rgb),.28); color: var(--cream);
    border-radius: 9px; padding: 8px 13px; font: inherit; font-size: 12.5px; cursor: pointer; }
  button:hover:not(:disabled) { background: rgba(var(--teal-rgb),.2); }
  button:disabled { opacity: .45; cursor: default; }
  .status { font-size: 12px; color: var(--dim); }
  .grid { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  #cv { width: 100%; height: 560px; display: block; border-radius: 14px;
    border: 1px solid rgba(var(--teal-rgb),.2); background: radial-gradient(circle at 50% 40%, #071120, #04070f 70%); cursor: grab; }
  #cv:active { cursor: grabbing; }
  .side { border: 1px solid rgba(var(--teal-rgb),.16); background: rgba(var(--teal-rgb),.03); border-radius: 14px; padding: 14px 16px; }
  .side h2 { font-size: 11px; letter-spacing: .16em; color: var(--dim); margin: 0 0 10px; font-weight: 500; }
  .act { padding: 9px 0; border-bottom: 1px solid rgba(var(--teal-rgb),.10); }
  .act:last-child { border-bottom: 0; }
  .act-t { font-size: 13.5px; }
  .act-n { color: var(--teal); font-size: 12px; font-variant-numeric: tabular-nums; }
  .act-s { font-size: 11.5px; color: var(--dim); margin-top: 3px; }
  .detail { margin-top: 14px; }
  .detail img { width: 100%; border-radius: 10px; display: block; margin-top: 10px; }
  .empty { color: var(--dim); font-size: 12.5px; }
</style>

<div class="wrap">
  <a class="back" href="/">← Jarvis</a>
  <h1>Goals</h1>
  <div class="sub">Every goal you've written, and where they share a path. Node size = how many times you wrote it.</div>

  <div class="bar">
    <button id="build">⟳ Rebuild the map</button>
    <button id="img" disabled>🖼 Picture this goal</button>
    <span class="status" id="status">loading…</span>
  </div>

  <div class="grid">
    <canvas id="cv"></canvas>
    <div>
      <div class="side">
        <h2>WHAT MOVES THE MOST</h2>
        <div id="acts"><div class="empty">Build the map to see this.</div></div>
      </div>
      <div class="side detail" id="detail" style="display:none"></div>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  let data = null, nodes = [], edges = [], selected = null, dragging = null, raf = null;

  function fit() {
    const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w: r.width, h: r.height };
  }

  // A tiny force layout. No library — his security rule says nothing ships from a CDN without an audit, and
  // 60 lines of spring physics is not worth a dependency.
  function layout(graph) {
    const { w, h } = fit();
    nodes = graph.nodes.map((n, i) => ({
      ...n,
      x: w / 2 + Math.cos((i / graph.nodes.length) * Math.PI * 2) * Math.min(w, h) * 0.32,
      y: h / 2 + Math.sin((i / graph.nodes.length) * Math.PI * 2) * Math.min(w, h) * 0.32,
      vx: 0, vy: 0,
      r: Math.min(26, 8 + (n.mentions || 1) * 2.2 + n.links * 0.8),
    }));
    edges = graph.edges.map((e) => ({ ...e, a: nodes.find((n) => n.id === e.from), b: nodes.find((n) => n.id === e.to) })).filter((e) => e.a && e.b);
    if (raf) cancelAnimationFrame(raf);
    let ticks = 0;
    (function step() {
      const { w: W, h: H } = { w: cv.clientWidth, h: cv.clientHeight };
      for (const n of nodes) {
        if (n === dragging) continue;
        for (const m of nodes) {
          if (m === n) continue;
          const dx = n.x - m.x, dy = n.y - m.y;
          const d2 = Math.max(400, dx * dx + dy * dy);
          const f = 9000 / d2;                       // repulsion so labels don't pile up
          n.vx += (dx / Math.sqrt(d2)) * f; n.vy += (dy / Math.sqrt(d2)) * f;
        }
        n.vx += (W / 2 - n.x) * 0.0016; n.vy += (H / 2 - n.y) * 0.0016;   // gentle centring
      }
      for (const e of edges) {                        // springs pull connected goals together
        const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;
        const d = Math.max(1, Math.hypot(dx, dy));
        const f = (d - 150) * 0.0025;
        if (e.a !== dragging) { e.a.vx += (dx / d) * f; e.a.vy += (dy / d) * f; }
        if (e.b !== dragging) { e.b.vx -= (dx / d) * f; e.b.vy -= (dy / d) * f; }
      }
      for (const n of nodes) {
        if (n === dragging) continue;
        n.vx *= 0.84; n.vy *= 0.84;
        n.x = Math.max(n.r + 4, Math.min(W - n.r - 4, n.x + n.vx));
        n.y = Math.max(n.r + 4, Math.min(H - n.r - 4, n.y + n.vy));
      }
      draw();
      if (++ticks < 600 || dragging) raf = requestAnimationFrame(step);
    })();
  }

  function draw() {
    const W = cv.clientWidth, H = cv.clientHeight;
    ctx.clearRect(0, 0, W, H);
    ctx.lineWidth = 1;
    for (const e of edges) {
      const hot = selected && (e.a === selected || e.b === selected);
      ctx.strokeStyle = hot ? 'rgba(90,190,180,.75)' : 'rgba(90,190,180,.16)';
      ctx.beginPath(); ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y); ctx.stroke();
    }
    for (const n of nodes) {
      const on = n === selected;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fillStyle = on ? 'rgba(90,190,180,.9)' : (n.links ? 'rgba(90,190,180,.32)' : 'rgba(125,139,150,.28)');
      ctx.fill();
      ctx.strokeStyle = on ? '#5abeb4' : 'rgba(90,190,180,.45)'; ctx.stroke();
      // Only label what he can read — everything labelled at once is a hairball.
      if (n.r > 13 || on) {
        ctx.fillStyle = on ? '#e8e6e1' : '#9fb4bb';
        ctx.font = (on ? '600 ' : '') + '11.5px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText(n.title.slice(0, 26), n.x, n.y + n.r + 13);
      }
    }
  }

  function at(ev) {
    const r = cv.getBoundingClientRect();
    const x = ev.clientX - r.left, y = ev.clientY - r.top;
    return nodes.find((n) => Math.hypot(n.x - x, n.y - y) <= n.r + 4) || null;
  }
  cv.addEventListener('mousedown', (ev) => { const n = at(ev); if (n) { dragging = n; select(n); if (!raf) layout({ nodes: data.graph.nodes, edges: data.graph.edges }); } });
  cv.addEventListener('mousemove', (ev) => {
    if (!dragging) return;
    const r = cv.getBoundingClientRect();
    dragging.x = ev.clientX - r.left; dragging.y = ev.clientY - r.top; draw();
  });
  window.addEventListener('mouseup', () => { dragging = null; });

  function select(n) {
    selected = n;
    $('img').disabled = false;
    const g = (data.goals || []).find((x) => x.id === n.id) || {};
    const d = $('detail');
    d.style.display = '';
    d.innerHTML = '<h2>' + (n.title || '').replace(/</g, '&lt;') + '</h2>'
      + '<div class="act-s">' + (g.category || '') + ' · written ' + (g.mentions || 1) + '×'
      + (g.sources && g.sources.length ? ' · ' + g.sources.slice(0, 2).join(', ') : '') + '</div>'
      + ((g.actions || []).length
        ? '<div style="margin-top:10px">' + g.actions.map((a) => '<div class="act-s">→ ' + String(a).replace(/</g, '&lt;') + '</div>').join('') + '</div>'
        : '<div class="act-s" style="margin-top:10px">No action chain yet — rebuild the map.</div>');
    draw();
  }

  function renderActions() {
    const el = $('acts');
    const list = (data && data.next) || [];
    if (!list.length) { el.innerHTML = '<div class="empty">Nothing yet.</div>'; return; }
    el.innerHTML = list.map((n) => '<div class="act"><div class="act-t">' + String(n.action).replace(/</g, '&lt;')
      + (n.leverage > 1 ? ' <span class="act-n">×' + n.leverage + '</span>' : '') + '</div>'
      + '<div class="act-s">' + (n.unlocks || []).slice(0, 3).join(' · ').replace(/</g, '&lt;') + '</div></div>').join('');
  }

  async function load(build) {
    $('status').textContent = build ? 'reverse-engineering your goals… (this takes a minute)' : 'loading…';
    $('build').disabled = true;
    try {
      const r = build
        ? await fetch('/api/goals/reverse', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ limit: 14 }) })
        : await fetch('/api/goals');
      data = await r.json();
      if (!data.ok) { $('status').textContent = data.error || 'could not load'; return; }
      if (!data.graph || !data.graph.nodes.length) { $('status').textContent = 'no goals found'; return; }
      // Before the reverse-engineering pass there are no edges — say so plainly rather than showing a
      // scatter of disconnected dots and letting him think that's the answer.
      const connected = data.graph.edges.length;
      $('status').textContent = data.graph.nodes.length + ' goals · ' + connected + ' shared paths'
        + (connected === 0 ? ' — press "Rebuild the map" to find the connections' : '');
      layout(data.graph);
      renderActions();
    } catch (e) { $('status').textContent = 'error: ' + e.message; }
    finally { $('build').disabled = false; }
  }

  // AI imagery — his "vision board" idea, one goal at a time and only on request, because generating 552
  // images unasked would cost real money for pictures he never looks at.
  $('img').addEventListener('click', async () => {
    if (!selected) return;
    $('img').disabled = true; $('status').textContent = 'picturing “' + selected.title + '”…';
    try {
      const r = await fetch('/api/goals/image', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id: selected.id, title: selected.title }),
      }).then((x) => x.json());
      if (r.ok && r.url) {
        const d = $('detail');
        const im = document.createElement('img'); im.src = r.url; im.alt = selected.title;
        d.appendChild(im);
        $('status').textContent = 'done.';
      } else $('status').textContent = r.error || 'could not generate an image';
    } catch (e) { $('status').textContent = 'error: ' + e.message; }
    finally { $('img').disabled = false; }
  });

  $('build').addEventListener('click', () => load(true));
  window.addEventListener('resize', () => { if (data && data.graph) layout(data.graph); });
  load(false);
</script>
